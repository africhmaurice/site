<!doctype html>
<html lang="en">
<head>

<title>Quiz Editor</title>
<!-- Quiz editor for the Sky Pirate Job Quiz. Open this file in a browser on your computer (double-click it).
     It edits assets/quiz/sky-pirate-quiz.json: traits, jobs, questions, answer points, and where loot box 40 hides.
     Nothing here goes online; "Download JSON" saves the edited file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Atomic Marker';src:url('https://static1.squarespace.com/static/68f0178dd88a7e52ec46ae7e/t/6aa9db35bc4f704c9378c402/1789516598919/Set+Sail+Studios+-+Atomic+Marker+Regular.otf') format('opentype');font-display:swap}
:root{--ink:#0b170f;--panel:#132219;--parch:#f3ead9;--paper:#fffffe;--ember:#c53200;--emberhi:#ff4c0f;--emberdk:#912501;--violet:#482d85;--violetlt:#7b4ee1;--lav:#c3a6ff;--green:#2c6021;--leaf:#a2f590;--teal:#268e62;--tealdk:#1a5e41;--mint:#89fbcb;--line:#0b170f;--muted:#4a5a4f}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:var(--parch);color:var(--ink);font-family:'Almarai',sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:'Atomic Marker',cursive;font-weight:400;letter-spacing:.03em;line-height:1.2;margin:0}
button,input,textarea,select{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer}
.top{background:var(--ink);color:var(--paper);padding:24px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;position:sticky;top:0;z-index:20;border-bottom:4px solid var(--ember)}
.top .brand{display:flex;flex-direction:column;gap:8px}
.top h1{font-size:clamp(26px,3.4vw,38px);color:var(--paper)}
.top .sub{margin:0;font-size:14px;color:var(--mint);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.top .acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;line-height:1.3}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.top .btn{border-color:var(--paper);background:transparent;color:var(--paper)}
.top .btn:hover,.top .btn:focus-visible{background:var(--paper);color:var(--ink)}
.btn.hot,.top .btn.hot{background:var(--ember);border-color:var(--ember);color:var(--paper)}
.btn.hot:hover,.top .btn.hot:hover,.btn.hot:focus-visible{background:var(--emberhi);border-color:var(--emberhi);color:var(--paper)}
.btn.small{font-size:12px;padding:6px 10px}
.btn.danger{border-color:var(--emberdk);color:var(--emberdk)}
.btn.danger:hover{background:var(--emberdk);color:var(--paper)}
.btn[disabled]{opacity:.35;cursor:default;pointer-events:none}
.status{font-size:13px;font-weight:700;color:var(--parch);letter-spacing:.04em}
.status.dirty{color:var(--emberhi)}
.notice{max-width:1180px;margin:20px auto 0;padding:0 20px}
.notice:empty{display:none}
.note{border:2px solid var(--ink);background:var(--paper);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.note.err{border-color:var(--ember);background:#fff1ea}
.note.ok{border-color:var(--teal);background:#e9f8f0}
.note p{margin:0}
.tabs{max-width:1180px;margin:24px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:8px}
.tab{border:2px solid var(--ink);background:transparent;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:10px 14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
main{max-width:1180px;margin:20px auto 80px;padding:0 20px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--paper);border:2px solid var(--ink);padding:24px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:clamp(22px,2.6vw,30px)}
.panel h3{font-size:20px}
.help{margin:0;color:var(--muted);font-size:15px;max-width:780px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.between{justify-content:space-between}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto;min-width:0}
.row>label.f{flex:1 1 220px}
input[type=text],textarea,select,input[type=number]{border:2px solid var(--ink);background:var(--paper);padding:10px 12px;width:100%;font-weight:400;font-size:15px;letter-spacing:0;text-transform:none;line-height:1.4}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus{outline:3px solid var(--violetlt);outline-offset:0}
.bad{border-color:var(--ember)!important;background:#fff1ea!important}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{border:2px solid var(--ink);padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--paper)}
.card.q{border-left:10px solid var(--violet)}
.card.job{border-top:10px solid var(--teal)}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 8px;background:var(--violet);color:var(--paper);font-weight:800}

.pts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}

.pt input{padding:6px 8px}
.pt.on input{border-color:var(--teal);background:#e9f8f0;font-weight:800}
.lootpick{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.lootpick input{width:18px;height:18px;accent-color:var(--ember)}
.weights{display:flex;flex-direction:column;gap:10px}
.w{display:grid;grid-template-columns:110px 1fr 36px;gap:12px;align-items:center;font-weight:700;font-size:14px}

.w b{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;padding:4px 10px;font-weight:800;font-size:13px;letter-spacing:.04em;line-height:1.4}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #cfc4af;padding:10px 12px;text-align:left;vertical-align:top;font-size:15px}
th{background:var(--ink);color:var(--paper);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
td.c,th.c{text-align:center}
.tablewrap{overflow-x:auto;max-width:100%}
.loottag{display:inline-block;margin-left:8px;background:var(--ember);color:var(--paper);font-weight:800;font-size:12px;padding:2px 8px;letter-spacing:.06em;text-transform:uppercase}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:120px 1fr 64px;gap:12px;align-items:center;font-weight:700;font-size:14px}
.barbg{height:18px;background:#e7dcc6;border:1px solid #cfc4af;position:relative}
.barfill{height:100%;background:var(--teal)}
.barrow.win .barfill{background:var(--ember)}
.barrow b{text-align:right}
.test{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.test .side{position:sticky;top:146px;max-height:calc(100vh - 166px);overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.tq{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid #cfc4af}
.tq:last-child{border-bottom:0}
.tq p{margin:0;font-weight:800}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topt{text-align:left;border:2px solid #cfc4af;background:#fbf7ef;padding:10px 12px;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:6px}
.topt:hover{border-color:var(--ink)}
.topt.sel{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.topt small{font-size:12px;opacity:.75;font-weight:700}
.result{border:3px solid var(--ember);padding:20px;display:flex;flex-direction:column;gap:10px;background:#fff1ea}
.result h3{font-size:30px;color:var(--ember)}
.result p{margin:0}
.issues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.issues li.e{color:var(--emberdk);font-weight:700}
.prose p{margin:0 0 12px}
.empty{color:var(--muted);font-style:italic}
.descrow{display:grid;grid-template-columns:200px 1fr auto;gap:12px;align-items:end;border-bottom:1px solid #cfc4af;padding-bottom:14px}
.swatch{display:inline-block;width:18px;height:18px;border:1px solid var(--ink);vertical-align:middle}
.hide{display:none!important}
@media (max-width:900px){.test{grid-template-columns:1fr}.test .side{position:static}}
@media (max-width:600px){
  .top{position:static}
  .topts{grid-template-columns:1fr}
  .descrow{grid-template-columns:1fr}
  .w{grid-template-columns:90px 1fr 30px}
  .barrow{grid-template-columns:96px 1fr 56px}
  .panel{padding:20px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>

var DEFAULT=/*DEFAULT*/{"version":1,"eyebrow":"All hands on deck","title":"What Sky Pirate Job Are You Most Like?","intro":"Every airship needs a crew. Answer nine questions and I'll tell you where you'd sign on.","resultLead":"You are most like the","share":"Screenshot this and tag @mauriceafrich with your result.","descriptors":[{"id":"bold","name":"Bold","def":"Runs toward trouble. Big swings, loud calls, no flinching."},{"id":"steady","name":"Steady","def":"Calm hands and a level head. Keeps things running when it gets bumpy."},{"id":"clever","name":"Clever","def":"Thinks it through. Puzzles, plans, maps, and math."},{"id":"crafty","name":"Crafty","def":"Makes something out of nothing. Fixes, builds, and improvises."},{"id":"watchful","name":"Watchful","def":"Notices everything. Sees the storm, the liar, and the shiny thing first."},{"id":"charming","name":"Charming","def":"Talks people into things. Leads, haggles, and wins the room."},{"id":"loyal","name":"Loyal","def":"Crew first, always. Stands in front of their people."},{"id":"restless","name":"Restless","def":"Can't sit still. Always moving, always curious, always halfway out the door."}],"jobs":[{"id":"captain","title":"Captain","color":"#ff4c0f","tagline":"The deck answers to you.","description":"You make the call when the sky turns ugly, and somehow the crew follows you into it. You are calm, a little reckless, and you never leave anyone behind on the dock.","weights":{"charming":3,"bold":2,"steady":1}},{"id":"pilot","title":"Pilot","color":"#89fbcb","tagline":"Hands on the wheel, eyes on the clouds.","description":"You feel the wind before it hits. Tight gaps, sudden drops, and storms are just a good day at work. The crew holds on and trusts you to bring the ship home in one piece.","weights":{"bold":3,"steady":2,"watchful":1}},{"id":"gunner","title":"Gunner","color":"#ff4c0f","tagline":"Loud, loyal, and very hard to argue with.","description":"When trouble shows up off the bow, you are already loading. You protect your people first and ask questions later, and nobody sleeps better than the crew with you on watch.","weights":{"loyal":3,"bold":2,"watchful":1}},{"id":"runner","title":"Runner","color":"#a2f590","tagline":"Fast feet, faster mouth.","description":"You carry the messages, the deals, and the gossip from one end of the ship to the other, and from port to port. If something needs doing yesterday, you are the one already halfway there.","weights":{"restless":3,"charming":2,"crafty":1}},{"id":"techtailor","title":"Techtailor","color":"#c3a6ff","tagline":"Needle in one hand, wrench in the other.","description":"You stitch sails, patch engines, and make gear nobody else could dream up from scraps. When something breaks, the crew yells your name, and you are already rolling up your sleeves.","weights":{"crafty":3,"clever":2,"steady":1}},{"id":"quartermaster","title":"Quartermaster","color":"#f3ead9","tagline":"Every coin counted, every barrel stacked.","description":"You keep the crew fed, paid, and honest. You know exactly what is in the hold, who owes what, and how to split the loot so nobody starts a mutiny over it.","weights":{"steady":3,"loyal":2,"clever":1}},{"id":"navigator","title":"Navigator","color":"#89fbcb","tagline":"Maps, stars, and a hunch.","description":"You read the sky like a book and always know which way home is. Where everyone else sees endless clouds, you see a route, a shortcut, and a secret island nobody has charted yet.","weights":{"clever":3,"restless":2,"watchful":1}},{"id":"lookout","title":"Lookout","color":"#a2f590","tagline":"Nothing gets past you.","description":"Up in the crow's nest, you spot the storm, the rival ship, and the shiny thing on the horizon long before anyone else. You notice the small stuff, and that is exactly why the crew is still alive.","weights":{"watchful":3,"restless":2,"loyal":1}}],"questions":[{"text":"A rival airship pulls up alongside. What do you do?","answers":[{"text":"Hail them and do the talking","points":{"charming":2,"bold":1}},{"text":"Swing us hard into the clouds","points":{"bold":2,"steady":1}},{"text":"Step in front of my crew and roll out the cannons","points":{"loyal":2,"bold":1}},{"text":"Count their crew and their cargo","points":{"watchful":2,"steady":1}}]},{"text":"Pick your spot on the ship.","answers":[{"text":"The wheel, obviously","points":{"steady":2,"bold":1}},{"text":"The crow's nest, way up top","points":{"watchful":2,"restless":1}},{"text":"The workshop below deck","points":{"crafty":2,"clever":1}},{"text":"The chart table by the lanterns","points":{"clever":2,"watchful":1}}]},{"text":"Shore leave in a new port. Where are you headed?","answers":[{"text":"The market, to stock the hold before prices go up","points":{"steady":2,"charming":1}},{"text":"Everywhere at once, I have errands","points":{"restless":2,"charming":1}},{"text":"The map shop with the dusty back room","points":{"clever":2,"restless":1}},{"text":"The docks, to make sure nobody messes with our ship","points":{"loyal":2,"watchful":1}}]},{"text":"What is in your pockets right now?","answers":[{"text":"A compass and a half-drawn map","points":{"clever":2,"restless":1}},{"text":"Spare bolts, thread, and a tiny screwdriver","points":{"crafty":2,"clever":1}},{"text":"A spyglass and a snack for whoever is on watch with me","points":{"watchful":2,"loyal":1}},{"text":"A sealed letter I am not supposed to read","points":{"restless":2,"crafty":1}}]},{"text":"The crew is arguing over the loot. You...","answers":[{"text":"Split it fair and write it down","points":{"steady":2,"charming":1}},{"text":"Settle it with one look","points":{"charming":2,"bold":1}},{"text":"Hide the best piece until they calm down","points":{"crafty":2,"restless":1}},{"text":"Fire one warning shot into the sky","points":{"bold":2,"charming":1}}]},{"text":"Something just broke and the ship is shaking. Your move?","answers":[{"text":"Hold her steady with both hands","points":{"steady":2,"bold":1}},{"text":"Find the safest route down","points":{"clever":2,"steady":1}},{"text":"Patch it with whatever is lying around","points":{"crafty":2,"clever":1},"lootBox":true},{"text":"Get every hand to a rope and keep them calm","points":{"charming":2,"loyal":1}}]},{"text":"Pick a sky pirate snack.","answers":[{"text":"Hardtack, rationed carefully","points":{"steady":2,"loyal":1}},{"text":"Whatever I can eat while running","points":{"restless":2,"charming":1}},{"text":"Spicy jerky, shared with my gun crew","points":{"loyal":2,"bold":1}},{"text":"Cloudberry pie, and I know exactly who took the last slice","points":{"watchful":3}}]},{"text":"A storm is coming. What is your first thought?","answers":[{"text":"I saw it an hour ago","points":{"watchful":2,"loyal":1}},{"text":"I know a way around it","points":{"clever":2,"restless":1}},{"text":"Let's fly right through it","points":{"bold":2,"restless":1}},{"text":"Are the sails stitched tight?","points":{"crafty":2,"watchful":1}}]},{"text":"Your crew would describe you as...","answers":[{"text":"The one in charge","points":{"charming":2,"bold":1}},{"text":"The one who would take a cannonball for them","points":{"loyal":2,"bold":1}},{"text":"The one who never runs out of anything","points":{"steady":2,"clever":1}},{"text":"The one you can never catch","points":{"restless":2,"crafty":1}}]}]}/*END*/;
var COLORS=[['#c53200','#fffffe'],['#268e62','#fffffe'],['#482d85','#fffffe'],['#2c6021','#fffffe'],['#912501','#fffffe'],['#1a5e41','#fffffe'],['#7b4ee1','#fffffe'],['#57bb41','#0b170f'],['#c3a6ff','#0b170f'],['#89fbcb','#0b170f']];
var JOB_COLORS=[['#ff4c0f','Scarlet'],['#89fbcb','Mint'],['#a2f590','Leaf'],['#c3a6ff','Lavender'],['#f3ead9','Parchment'],['#fffffe','White'],['#7b4ee1','Violet'],['#57bb41','Green']];

var S=null,tab='questions',dirty=false,picks=[];
var view=document.getElementById('view'),notice=document.getElementById('notice');

// ---------- helpers ----------
function h(tag,attrs){var el=document.createElement(tag);attrs=attrs||{};
  for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='text')el.textContent=v;else if(k==='cls')el.className=v;else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;else if(k==='checked')el.checked=!!v;else if(k==='style')el.setAttribute('style',v);else el.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);return el;}
function add(el,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(el,x);});return;}el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'trait';}
function uniqueId(base,list){var id=base,n=2;while(list.some(function(x){return x.id===id;}))id=base+'-'+(n++);return id;}
function dname(id){var d=S.descriptors.filter(function(x){return x.id===id;})[0];return d?d.name:id;}
function dcolor(id){var i=S.descriptors.map(function(d){return d.id;}).indexOf(id);return COLORS[(i<0?0:i)%COLORS.length];}
function chip(id,val){var c=dcolor(id);return h('span',{cls:'chip',style:'background:'+c[0]+';color:'+c[1]},dname(id)+(val!=null?' +'+val:''));}
function keysBy(p){return Object.keys(p).sort(function(a,b){return n(p[b])-n(p[a]);});}
function n(v){v=+v;return isFinite(v)?v:0;}

// ---------- data ----------
function normalize(d){
  d=d&&typeof d==='object'?d:{};
  ['eyebrow','title','intro','resultLead','share'].forEach(function(k){if(typeof d[k]!=='string')d[k]='';});
  d.descriptors=Array.isArray(d.descriptors)?d.descriptors:[];
  d.descriptors.forEach(function(x,i){x.name=x.name||'';x.def=x.def||'';x.id=x.id||slug(x.name)||('trait-'+(i+1));});
  var ids=d.descriptors.map(function(x){return x.id;});
  d.jobs=Array.isArray(d.jobs)?d.jobs:[];
  d.jobs.forEach(function(j,i){['title','tagline','description'].forEach(function(k){j[k]=j[k]||'';});j.id=j.id||slug(j.title)||('job-'+(i+1));j.color=j.color||'#ff4c0f';
    var w={};ids.forEach(function(id){if(j.weights&&n(j.weights[id]))w[id]=n(j.weights[id]);});j.weights=w;});
  d.questions=Array.isArray(d.questions)?d.questions:[];
  var lootSeen=false;
  d.questions.forEach(function(q){q.text=q.text||'';q.answers=Array.isArray(q.answers)?q.answers:[];
    q.answers.forEach(function(a){a.text=a.text||'';var p={};ids.forEach(function(id){if(a.points&&n(a.points[id]))p[id]=n(a.points[id]);});a.points=p;
      if(a.lootBox&&!lootSeen){a.lootBox=true;lootSeen=true;}else delete a.lootBox;});});
  return d;
}
function setData(d,msg){S=normalize(clone(d));picks=[];dirty=false;status();render();if(msg)say(msg,'ok');}
function changed(){dirty=true;status();try{localStorage.setItem(DRAFT_KEY,JSON.stringify({at:Date.now(),data:S}));}catch(e){}}
function status(){var s=document.getElementById('status');s.textContent=dirty?'Unsaved changes (download to keep them)':'No changes yet';s.className='status'+(dirty?' dirty':'');}

// ---------- scoring ----------
function addPts(tot,p){for(var k in p)tot[k]=(tot[k]||0)+n(p[k]);}
function jobScore(j,tot){var s=0;for(var k in j.weights)s+=(tot[k]||0)*n(j.weights[k]);return s;}
function pickJob(tot){var best=-1,bs=-Infinity;S.jobs.forEach(function(j,i){var s=jobScore(j,tot);if(s>bs){bs=s;best=i;}});return best;}
function simulate(){
  var qs=S.questions.filter(function(q){return q.answers.length;});var counts=S.jobs.map(function(){return 0;});
  if(!qs.length||!S.jobs.length)return {counts:counts,total:0,exact:true};
  var combos=qs.reduce(function(m,q){return m*q.answers.length;},1),total=0;
  if(combos<=300000){var idx=qs.map(function(){return 0;});

// ---------- validation ----------
function validate(withSim){
  var E=[],W=[];
  if(!S.title.trim())E.push('The quiz title is empty (Page text).');
  if(!S.descriptors.length)E.push('There are no traits.');
  S.descriptors.forEach(function(d,i){if(!d.name.trim())E.push('Trait '+(i+1)+' has no name.');if(!d.def.trim())W.push('Trait "'+(d.name||i+1)+'" has no definition.');});
  var names={};S.descriptors.forEach(function(d){var k=d.name.trim().toLowerCase();if(k&&names[k])E.push('Two traits are both called "'+d.name+'".');names[k]=1;});
  if(S.jobs.length<2)E.push('The quiz needs at least two jobs.');
  S.jobs.forEach(function(j,i){var nm=j.title||('Job '+(i+1));
    if(!j.title.trim())E.push('Job '+(i+1)+' has no title.');
    if(!j.tagline.trim())W.push(nm+' has no tagline.');
    if(!j.description.trim())E.push(nm+' has no description.');
    if(!Object.keys(j.weights).length)E.push(nm+' has no trait weights, so it can never win.');});
  if(!S.questions.length)E.push('There are no questions.');
  S.questions.forEach(function(q,i){var qn='Question '+(i+1);
    if(!q.text.trim())E.push(qn+' has no question text.');
    if(q.answers.length<2)E.push(qn+' needs at least two answers.');
    q.answers.forEach(function(a,j){var an=qn+', answer '+LETTERS.charAt(j);
      if(!a.text.trim())E.push(an+' has no text.');
      if(!Object.keys(a.points).length)W.push(an+' gives no points to any trait.');});});
  var loot=0;S.questions.forEach(function(q){q.answers.forEach(function(a){if(a.lootBox)loot++;});});
  if(loot===0)E.push('No answer has the loot box. Pick one with "Loot box hides here" (Questions).');
  S.descriptors.forEach(function(d){var used=S.questions.some(function(q){return q.answers.some(function(a){return n(a.points[d.id])>0;});});
    if(!used)W.push('No answer gives points to "'+d.name+'".');
    var inJob=S.jobs.some(function(j){return n(j.weights[d.id])>0;});if(!inJob)W.push('No job cares about "'+d.name+'", so its points do nothing.');});
  var sim=null;
  if(withSim&&S.jobs.length&&S.questions.length){sim=simulate();
    var even=100/S.jobs.length;
    S.jobs.forEach(function(j,i){var p=sim.total?sim.counts[i]/sim.total*100:0;
      if(sim.counts[i]===0)E.push((j.title||'Job '+(i+1))+' can never be the result. No set of answers reaches it.');
      else if(p<even*0.5)W.push((j.title||'Job '+(i+1))+' is rare: only '+p.toFixed(1)+'% of answer sets land on it (an even share is '+even.toFixed(1)+'%).');
      else if(p>even*1.6)W.push((j.title||'Job '+(i+1))+' is common: '+p.toFixed(1)+'% of answer sets land on it (an even share is '+even.toFixed(1)+'%).');});}
  return {errors:E,warnings:W,sim:sim};
}

      h('button',{cls:'btn small',type:'button',onclick:function(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}notice.innerHTML='';}},'Throw them away')));}}catch(e){}
})();
</script>
