<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Riddle 4 Options</title>
<style>
:root{--ink:#0b170f;--card:#213226;--line:rgba(162,245,144,.2);--text:#fff;--muted:#9fb3a5}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:16px/1.4 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(11,23,15,.97);border-bottom:1px solid var(--line);padding:14px 16px}
h1{margin:0 0 4px;font-size:18px}p{margin:0;color:var(--muted);font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;font-size:14px;color:#fff;background:var(--card);border:2px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer}
button[aria-pressed=true]{border-color:currentColor}
.a{color:#ff6b81}.b{color:#6ea8ff}.c{color:#4dffa0}.d{color:#ffe24d}
button b{color:#fff}
main{display:flex;justify-content:center;padding:16px}img{width:100%;max-width:900px;display:block}
</style></head><body>
<header>
  <h1>Riddle #4: which boxes should count?</h1>
  <p>The Hunt page on a desktop screen (today, before riddles #4 to #6 are added). Each option is outlined and numbered on the page.</p>
  <nav id="nav">
    <button class="a" data-k="A">A · Outlined boxes and buttons <b>59</b></button>
    <button class="b" data-k="B">B · How to earn points boxes <b>33</b></button>
    <button class="c" data-k="C">C · Cards <b>9</b></button>
    <button class="d" data-k="D">D · Solid filled shapes <b>24</b></button>
  </nav>
</header>
<main><img id="shot" alt="Hunt page with the chosen boxes outlined"></main>
<script>
var btns=document.querySelectorAll('#nav button'),img=document.getElementById('shot');
function show(k){img.src=k+'.jpg';btns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===k)});}
btns.forEach(function(b){b.onclick=function(){show(b.dataset.k)}});show('A');
</script>
</body></html>
