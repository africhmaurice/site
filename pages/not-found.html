<!-- ============================================================
     404 PAGE (Maurice, 2026-10-11): Squarespace's 404 page shows this. Loot box 40 is the 0 in "404"; clicking it
     opens its claim page. The One of Us page's random links /abandon-ship and /off-the-map land here on purpose.
     Wording is Maurice-approved from the mockup.
     ============================================================ -->
<style>
@font-face{font-family:'Cracked Imperia';src:url('https://africhmaurice.github.io/site/assets/fonts/CrackedImperia-Bold.woff2') format('woff2');font-weight:100 900;font-display:block;size-adjust:109.5%}
#ma-404{width:100vw;position:relative;left:50%;margin-left:-50vw;box-sizing:border-box;min-height:70vh;padding:clamp(40px,8vh,90px) 20px clamp(60px,10vh,110px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;background:#c53200;color:#fffffe;font-family:'Almarai',sans-serif}
#ma-404 *{box-sizing:border-box;border-radius:0}
#ma-404 .n{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,24px)}
#ma-404 .d{font-family:'Cracked Imperia',Impact,sans-serif;font-weight:400;font-size:clamp(130px,22vw,260px);line-height:1.05;letter-spacing:.03em;color:#fffffe}
#ma-404 .box,#ma-404 .box:hover{display:block;width:clamp(120px,19vw,230px);min-width:0;padding:0!important;margin:0;border:0!important;background:none!important;box-shadow:none!important;cursor:pointer;animation:b404 3s ease-in-out infinite}
#ma-404 .box img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
#ma-404 .box:focus-visible{outline:3px solid #fffffe;outline-offset:8px}
@keyframes b404{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
#ma-404 h1{margin:0;font-family:'Cracked Imperia',Impact,sans-serif;font-weight:400;font-size:clamp(38px,6vw,68px);line-height:1.05;letter-spacing:.03em;color:#fffffe;text-wrap:balance}
#ma-404 p{margin:0;max-width:560px;font-weight:700;font-size:clamp(17px,1.9vw,20px);line-height:1.55;color:#fffffe}
#ma-404 .go{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:6px}
#ma-404 .go a{display:inline-block;padding:13px 22px;border:2px solid #fffffe;color:#fffffe;text-decoration:none;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
#ma-404 .go a:hover,#ma-404 .go a:focus-visible{background:#fffffe;color:#c53200;outline:none}
@media (prefers-reduced-motion:reduce){#ma-404 .box{animation:none}}
</style>
<section id="ma-404">
  <div class="n" aria-label="404"><span class="d">4</span><button class="box" type="button" aria-label="Open loot box 40"><img src="https://africhmaurice.github.io/leaderboard/loot/40.png" alt="Loot box 40"></button><span class="d">4</span></div>
  <h1>This page fell off the map</h1>
  <p>Even sky pirates get lost. You did find something, though.</p>
  <div class="go"><a href="https://www.mauriceafrich.com/">Home</a><a href="https://www.mauriceafrich.com/the-hunt">The Treasure Hunt</a><a href="https://www.mauriceafrich.com/lootbox-clue">Clues</a></div>
</section>
<script>(function(){
  var d=document.getElementById('ma-404');if(!d)return;
  var sec=d.closest('section.page-section')||(d.parentElement&&d.parentElement.closest('section'));if(sec&&sec!==d){sec.style.background='#c53200';sec.style.minHeight='0';Array.prototype.forEach.call(sec.querySelectorAll('.section-background,.section-border'),function(x){x.style.display='none';});}
  var cw=d.closest('.content-wrapper');if(cw){cw.style.padding='0';cw.style.maxWidth='none';}var fe=d.closest('.fluid-engine');if(fe)fe.style.display='block';
  var k='MDU=';
  d.querySelector('.box').addEventListener('click',function(){location.href=atob(k).split('').reverse().join('');});
})();</script>
