<!-- ============================================================
     SOME ASSEMBLY REQUIRED - loot box 61 (Riddles & Puzzles card on the Hunt page).
     LOOT BOX in Almarai, uppercase, drawn in thin lines. Every letter is cut into 5 jigsaw pieces (35 in all),
     scattered in the tray under the board. Drag a piece near its spot and it snaps in and locks.
     The three O's are the same, so an O piece fits the matching spot in any O that is still open.
     All 35 in place: the board flashes emerald and loot box 61 appears; clicking it opens the claim link.
     The cuts, tab directions, and starting spots are new on every load.
     Heading is Maurice's clue. DRAFT (Maurice to approve): the small "Shuffle" button.
     ============================================================ -->

<style>
@font-face{font-family:'Atomic Marker';src:url('https://static1.squarespace.com/static/68f0178dd88a7e52ec46ae7e/t/6aa9db35bc4f704c9378c402/1789516598919/Set+Sail+Studios+-+Atomic+Marker+Regular.otf') format('opentype');font-display:block}
html,body{margin:0 !important;padding:0 !important;background:#0b170f !important}

  background:#0b170f;font-family:'Almarai',sans-serif;color:#f3ead9;text-align:center;overflow-x:hidden}
#ma-assembly *{box-sizing:border-box;border-radius:0}
#ma-assembly .sa-wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:24px}
#ma-assembly h1{margin:0;font-family:'Atomic Marker',cursive;font-weight:400;font-size:clamp(34px,5.4vw,60px);line-height:1.2;letter-spacing:.04em;color:#fffffe;padding:0 4px}
#ma-assembly .sa-shuffle{margin:0;padding:10px 18px;border:1px solid rgba(243,234,217,.4);background:none;color:#f3ead9;font-family:'Almarai',sans-serif;font-weight:700;
  font-size:13px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
#ma-assembly .sa-shuffle:hover{border-color:#89fbcb;color:#89fbcb}
#ma-assembly .sa-shuffle:focus-visible{outline:2px solid #89fbcb;outline-offset:3px}
#ma-assembly .sa-shuffle[disabled]{opacity:.35;cursor:default;border-color:rgba(243,234,217,.4);color:#f3ead9}
#ma-assembly .sa-play{position:relative;width:100%;margin-top:8px}
/* Board cells: faint outlines where the letters go */
#ma-assembly .sa-cell{position:absolute;border:1px solid rgba(243,234,217,.24);z-index:1}
/* Pieces: only the piece shape itself takes clicks, so the empty corners around tabs never block a neighbor */
#ma-assembly .sa-pc{position:absolute;left:0;top:0;z-index:2;pointer-events:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#ma-assembly .sa-pc svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
#ma-assembly .sa-pc .hit{pointer-events:all;cursor:grab;touch-action:none}
#ma-assembly .sa-pc.drag .hit{cursor:grabbing}
#ma-assembly .sa-pc.glide{transition:left .16s ease-out,top .16s ease-out}
#ma-assembly .sa-pc .bg{fill:#0b170f}
#ma-assembly .sa-pc .gl{fill:rgba(243,234,217,.1);stroke:#f3ead9;stroke-width:1.6px;stroke-linejoin:round}
#ma-assembly .sa-pc .ln{fill:none;stroke:rgba(243,234,217,.62);stroke-width:1.2px;stroke-linejoin:round}
#ma-assembly .sa-pc.drag .ln{stroke:#89fbcb}
#ma-assembly .sa-pc.set .ln{stroke:rgba(243,234,217,.16)}
#ma-assembly .sa-pc.set .hit{pointer-events:none}
/* Solved: the board flashes emerald */
#ma-assembly .sa-play.ok .sa-cell{border-color:#89fbcb}
#ma-assembly .sa-play.ok .sa-pc .bg{animation:sa-flash 1.1s ease-out both}
#ma-assembly .sa-play.ok .sa-pc .gl{stroke:#89fbcb}
#ma-assembly .sa-play.ok .sa-pc .ln{stroke:rgba(137,251,203,0)}
@keyframes sa-flash{0%{fill:#268e62}100%{fill:#132219}}
/* The prize */
#ma-assembly .sa-box{position:absolute;margin:0;padding:0;border:0;background:none;cursor:pointer;z-index:3;filter:drop-shadow(0 0 30px rgba(137,251,203,.4));animation:sa-rise .9s cubic-bezier(.2,.9,.3,1.2) both}
#ma-assembly .sa-box img{display:block;width:100%;height:100%;object-fit:contain}
#ma-assembly .sa-box:focus-visible{outline:2px solid #89fbcb;outline-offset:8px}
#ma-assembly .sa-box[hidden]{display:none}
@keyframes sa-rise{0%{transform:translateY(40px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
@media (max-width:640px){
  #ma-assembly{padding:44px 16px 56px}
  #ma-assembly .sa-wrap{gap:20px}
}
@media (prefers-reduced-motion:reduce){
  #ma-assembly .sa-pc.glide{transition:none}
  #ma-assembly .sa-play.ok .sa-pc .bg{animation:none;fill:#1a5e41}
  #ma-assembly .sa-box{animation:none}
}

  // ---------- dragging ----------
  function targets(pc){

  function win(){

    setTimeout(function(){play.classList.add('ok');setTimeout(function(){showBox(false);},calm?100:900);},calm?0:180);

  function bind(pc){

      if(!drag)return;var v=0,m=56;
      if(drag.cy<m)v=-Math.ceil((m-drag.cy)/5);else if(drag.cy>window.innerHeight-m)v=Math.ceil((drag.cy-(window.innerHeight-m))/5);
      if(v){window.scrollBy(0,v);moveTo(drag.cx,drag.cy);drag.raf=requestAnimationFrame(edgeScroll);}else drag.raf=0;
    }
    hit.addEventListener('pointermove',function(e){
      if(!drag||e.pointerId!==drag.id)return;
      drag.cx=e.clientX;drag.cy=e.clientY;moveTo(e.clientX,e.clientY);
      if(!drag.raf)drag.raf=requestAnimationFrame(edgeScroll);
    });
    function end(e){
      if(!drag||e.pointerId!==drag.id)return;
      if(drag.raf)cancelAnimationFrame(drag.raf);drag=null;
      pc.el.classList.remove('drag');
      tryLock(pc);
    }
    hit.addEventListener('pointerup',end);hit.addEventListener('pointercancel',end);
    // ma-touchfix: phones ignore touch-action on SVG shapes, so stop the page from taking the gesture as a scroll.
    hit.addEventListener('touchstart',function(e){if(!solved&&!pc.cell)e.preventDefault();},{passive:false});
    hit.addEventListener('touchmove',function(e){if(drag)e.preventDefault();},{passive:false});
  }

  // ---------- start ----------
  function build(){
    setFont();
    shapes={};WORD.forEach(function(L){if(!shapes[L])shapes[L]=makeShape(L);});
    cells=WORD.map(function(L){var c=document.createElement('div');c.className='sa-cell';play.appendChild(c);return {L:L,el:c,got:[]};});
    WORD.forEach(function(L,q){if(WORD.indexOf(L)!==q)return;var sh=shapes[L];
      for(var i=0;i<sh.parts.length;i++){var n=WORD.filter(function(x){return x===L;}).length;
        for(var r=0;r<n;r++){var pc=makePiece(sh,i);pieces.push(pc);play.appendChild(pc.el);bind(pc);}}});
    layout();
  }
  box.addEventListener('click',function(){location.href=atob(k).split('').reverse().join('');});
  shuf.addEventListener('click',function(){if(!solved)scatter();});
  var lastW=0,rt=0;
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){var w=play.clientWidth;if(Math.abs(w-lastW)<4)return;lastW=w;layout();},120);});
  function go(){if(pieces.length)return;build();lastW=play.clientWidth;}
  var fl=document.fonts&&document.fonts.load?document.fonts.load('800 100px Almarai'):null;
  if(fl){var done=false,once=function(){if(!done){done=true;go();}};fl.then(once,once);setTimeout(once,3000);}else go();
})();
</script>
