<!-- ============================================================
     ICON SEA - a seek-and-find. A full-width field packed edge to edge with thousands of
     Font Awesome Free 6 icons (solid and regular free sets), painted onto one canvas in
     layers (big backdrop, mid, gap fill, top sprinkle) by a seeded generator, so every
     visitor sees the same field. Loot box 38 is a real button on top, hidden among red
     chest decoys. Tapping any other icon wiggles it; clicking the real box opens loot box 38.
     ============================================================ -->

     add ?preview=1 to the address to see the page. Delete this block at launch. -->

<script>(function(){if(/[?&]preview=1\b/.test(location.search)){var h=document.getElementById('ma-hold');if(h)h.parentNode.removeChild(h);}else{document.documentElement.classList.add('ma-held');}})();</script>

<style>
@font-face{font-family:'Atomic Marker';src:url('https://static1.squarespace.com/static/68f0178dd88a7e52ec46ae7e/t/6aa9db35bc4f704c9378c402/1789516598919/Set+Sail+Studios+-+Atomic+Marker+Regular.otf') format('opentype');font-display:block}
@font-face{font-family:'MA Sea FA';font-weight:900;font-style:normal;font-display:block;src:url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-solid-900.woff2') format('woff2')}
@font-face{font-family:'MA Sea FA';font-weight:400;font-style:normal;font-display:block;src:url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-regular-400.woff2') format('woff2')}
#ma-sea{width:100vw;position:relative;left:50%;margin-left:-50vw;box-sizing:border-box;background:#0b170f;color:#fffffe;font-family:'Almarai',sans-serif;overflow:hidden}
#ma-sea *{box-sizing:border-box;border-radius:0}
#ma-sea .s-head{display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 20px 32px;text-align:center;background:#132219;border-bottom:3px solid #c53200;position:relative;z-index:2}
#ma-sea .s-title{margin:0;font-family:'Atomic Marker',cursive;font-weight:400;font-size:clamp(34px,5vw,60px);line-height:1.25;letter-spacing:.04em;color:#f3ead9}
#ma-sea .s-line{margin:0;max-width:640px;font-size:clamp(15px,1.4vw,18px);line-height:1.55;font-weight:700;color:#c3a6ff}
#ma-sea .s-field{position:relative;width:100%;height:160vh;min-height:900px;overflow:hidden;cursor:pointer;
  background:radial-gradient(ellipse at 30% 20%,#18301f 0%,#0b170f 55%),#0b170f;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#ma-sea .s-cv{position:absolute;left:0;top:0;display:block;pointer-events:none}
#ma-sea .s-g{position:absolute;left:0;top:0;line-height:1;font-family:'MA Sea FA';white-space:nowrap;pointer-events:none;text-shadow:0 1.5px 0 rgba(0,0,0,.4)}
#ma-sea .s-g.pop{z-index:2;animation:s-wig .5s ease}
#ma-sea .s-g.cvr{z-index:4}
@keyframes s-wig{0%,100%{rotate:0deg;scale:1}20%{rotate:-16deg;scale:1.3}40%{rotate:13deg;scale:1.3}60%{rotate:-9deg;scale:1.18}80%{rotate:5deg;scale:1.08}}
#ma-sea .s-box{position:absolute;padding:6px;margin:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;line-height:0}

#ma-sea .s-box:focus-visible{outline:2px dashed #89fbcb;outline-offset:2px}
#ma-sea .s-foot{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 20px 28px;text-align:center;background:#132219;border-top:3px solid #268e62}
#ma-sea .s-foot p{margin:0}
#ma-sea .s-tip{font-size:14px;line-height:1.5;font-weight:700;letter-spacing:.08em;color:rgba(243,234,217,.55)}
#ma-sea .s-credit{font-size:12px;line-height:1.5;font-weight:400;color:rgba(243,234,217,.45)}

@media (prefers-reduced-motion:reduce){#ma-sea .s-g.pop{animation:none}}
</style>
<section id="ma-sea" aria-label="Find the Loot Box">
  <div class="s-head">
    <h2 class="s-title">Find the Loot Box</h2>
    <p class="s-line">I buried loot box 38 somewhere in this heap of junk, chests, and skulls. Spot it, click it, and it's yours.</p>
  </div>
  <div class="s-field" role="group" aria-label="A sea of icons"><canvas class="s-cv" aria-hidden="true"></canvas></div>
  <div class="s-foot">
    <p class="s-tip">KEEP LOOKING, SKY PIRATE. IT'S SMALLER THAN YOU THINK.</p>
    <p class="s-credit">Icons by Font Awesome (<a href="https://fontawesome.com" target="_blank" rel="noopener">fontawesome.com</a>), used under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.</p>
  </div>
</section>
<script>
(function(){
  var root=document.getElementById('ma-sea');if(!root)return;
  var field=root.querySelector('.s-field'),cv=field.querySelector('.s-cv');
  var FAM='"MA Sea FA"';

  // Font Awesome Free 6.5.2 glyphs, solid (900) and regular (400) free sets only. One character per icon.
  var TRE='\uf187\uf466\uf49e\uf81d\uf51e\uf084\uf21a\uf13d\uf54c\uf714\uf279\uf14e\uf3a5\uf521\uf06b\uf552\uf0f2\uf0b1\uf70e\uf1cd\ue445\uf6d9\uf70b\uf091\uf0d6\uf023\ue2c5\uf6e8\ue56a\uf447';
  var JUNK='\uf005\uf186\uf185\uf0c2\uf0e7\uf06d\uf004\uf0f3\uf001\uf7a6\uf02d\uf518\uf52d\uf56b\uf578\uf4ba\uf520\uf6be\uf6d3\uf6f0\uf6d5\uf6e2\uf254\uf0eb\uf135\uf072\uf0e9\uf72f\uf7b6\uf1e2\uf3ed\uf441\uf443\uf445\uf43f\uf522\uf523\uf12e\uf1e5\uf8c0\uf530\uf6fa\uf5ad\uf09c\uf0c3\ue2ca\uf563\uf5d1\uf094\uf787\uf06c\uf1bb\uf4d8\uf6fc\uf773\uf72e\uf2dc\uf6bb\uf6e3\uf0ad\uf013\uf5a2\uf24e\ue139\uf5d7\uf717\uf52e\uf6ed\uf535\uf700\uf1b0\uf256\uf06e\uf188\uf786\uf816\uf810\uf5ca\ue57d\uf863\uf11b\uf025\uf569\uf5bb\ue2cd\uf818\uf805\ue4ad\uf4d7\uf024\uf277\ue586\ue4c8\uf6c3\uf6c4\uf753\ue0b7\ue448\ue4f2\ue599\uf6c8\ue520\ue52b\uf8c1\uf7b5\uf696\uf553\ue085\uf4fb\uf544\uf6de\ue1a8\uf1fd\uf7ef\uf7fb\uf7e5\ue4c6\uf0f4\uf4e3\uf7a0\ue4c5\ue516\uf564\uf80f\uf551\uf56a\uf8d9\uf8d7\uf130\uf568\uf545\uf303\uf1fc\uf53f\uf55d\uf0c4\uf08d\uf0c6\uf076\ue4f3\uf492\uf5d2\uf471\uf610\uf7bf\uf0ac\uf57d\ue52f\uf770\uf76f\uf75b\uf73d\uf043\uf769\uf7ad\uf7e4\uf252\uf2f2\uf017\uf562\uf43a\uf43c\uf6cf\uf6d1\uf132\ue574\uf54b\uf7ab\ue4d0';
  var REG='\uf005\uf004\uf3a5\uf279\uf14e\uf186\uf185\uf0f3\uf0eb\uf256\uf06e\uf2dc\uf017\uf0e0\uf024\uf441\uf445\uf43f\uf447\uf443\uf43a\uf1cd\uf1d8\uf094\uf254\uf587\uf5c2\uf58b\uf567\uf59b\uf1e3\uf03e\uf02e\uf249\uf25b\uf259\uf11c';
  var CHEST='\uf187\uf466\uf552\uf0f2\uf0b1\uf49e\uf06b';
  var MOON='\uf186';

  // Seeded generator: the same field for everyone at a given width.
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function pick(R,a){return a[Math.floor(R()*a.length)];}
  var DEEP=['#482d85','#1a5e41','#2c6021','#912501','#268e62','#7b4ee1','#c53200','#57bb41'];
  var COLORS=['#7b4ee1','#c3a6ff','#482d85','#c53200','#ff4c0f','#912501','#2c6021','#a2f590','#57bb41','#268e62','#89fbcb','#1a5e41','#f3ead9','#fffffe','#fd7547','#d9b65a'];
  var BRIGHT=['#f3ead9','#fffffe','#89fbcb','#a2f590','#c3a6ff','#ff4c0f','#d9b65a','#fd7547','#7b4ee1','#57bb41'];
  var REDS=['#c53200','#ff4c0f','#912501','#c53200'];

  var BOX={x:.693,y:.587,rot:-11};   // fixed spot for the box (fraction of the field)
  var items=[],built=0,lastW=0,bs=44;

  function layout(W,H){
    var R=rng(80038),f=Math.max(.62,Math.min(1.05,W/1440)),its=[];
    var g=8,cols=Math.ceil(W/g),rows=Math.ceil(H/g),cov=new Uint8Array(cols*rows);
    function mark(x,y,r){
      var c0=Math.max(0,Math.floor((x-r)/g)),c1=Math.min(cols-1,Math.floor((x+r)/g)),r0=Math.max(0,Math.floor((y-r)/g)),r1=Math.min(rows-1,Math.floor((y+r)/g));
      for(var rr=r0;rr<=r1;rr++)for(var cc=c0;cc<=c1;cc++){var dx=(cc+.5)*g-x,dy=(rr+.5)*g-y;if(dx*dx+dy*dy<=r*r)cov[rr*cols+cc]=1;}
    }
    function put(ch,w,x,y,s,rot,c,o,cr){its.push({ch:ch,w:w,x:x,y:y,s:s,rot:rot,c:c,o:o});if(cr)mark(x,y,s*cr);}
    function glyph(tp){var r=R();if(r<.1)return[REG.charAt(Math.floor(R()*REG.length)),400];var s=r<.1+tp?TRE:JUNK;return[s.charAt(Math.floor(R()*s.length)),900];}
    function tilt(){return(R()*2-1)*(R()<.25?70:32);}
    var x,y,gl,s,st;
    // 1. Big backdrop icons in deep colors.
    st=118*f;
    for(y=-st*.5;y<H+st*.5;y+=st)for(x=-st*.5;x<W+st*.5;x+=st){gl=glyph(.25);s=(100+R()*90)*f;put(gl[0],gl[1],x+R()*st,y+R()*st,s,tilt(),pick(R,DEEP),.6+R()*.3,.3);}
    // 2. Mid layer, the full palette.
    st=50*f;
    for(y=-st*.5;y<H+st*.5;y+=st)for(x=-st*.5;x<W+st*.5;x+=st){gl=glyph(.3);s=(30+R()*48)*f;put(gl[0],gl[1],x+R()*st,y+R()*st,s,tilt(),pick(R,COLORS),.82+R()*.18,.32);}
    // 3. Red herrings: scarlet chests and white moons the same size as the box.
    var nr=Math.round(70*W*H/(1440*1440));
    for(var i=0;i<nr;i++){put(CHEST.charAt(Math.floor(R()*CHEST.length)),900,R()*W,R()*H,bs*(.7+R()*.5),(R()*2-1)*25,pick(R,REDS),1,.35);if(i%3===0)put(MOON,900,R()*W,R()*H,bs*(.35+R()*.25),(R()*2-1)*60,'#f3ead9',.95,.3);}
    // 4. Fill every gap that is still showing ink.
    var n=cols*rows,ord=new Uint32Array(n),k,t;
    for(k=0;k<n;k++)ord[k]=k;
    for(k=n-1;k>0;k--){t=Math.floor(R()*(k+1));var sw=ord[k];ord[k]=ord[t];ord[t]=sw;}
    for(k=0;k<n;k++){var id=ord[k];if(cov[id])continue;gl=glyph(.3);s=Math.max(12,(17+R()*26)*f);
      put(gl[0],gl[1],(id%cols+.5)*g+(R()-.5)*g,(Math.floor(id/cols)+.5)*g+(R()-.5)*g,s,tilt(),pick(R,COLORS),.88+R()*.12,.42);}
    // 5. Small bright icons sprinkled on top for detail.
    var ns=Math.round(W*H/3600);
    for(k=0;k<ns;k++){gl=glyph(.3);put(gl[0],gl[1],R()*W,R()*H,Math.max(10,(12+R()*16)*f),tilt(),pick(R,BRIGHT),.92+R()*.08,0);}
    return its;
  }

  function nearBox(bx,by){
    // A cluster of chests, coins, and moons right around the box so it blends in.
    var q=[['\uf187',-1.25,-.55,'#c53200',1.0],['\uf51e',1.15,.75,'#d9b65a',.7],['\uf084',-.95,1.1,'#f3ead9',.6],['\uf466',1.4,-1.0,'#ff4c0f',.95],['\uf81d',.15,-1.45,'#a2f590',.8],['\uf54c',-1.6,.9,'#fffffe',.7],['\uf3a5',1.6,.2,'#89fbcb',.55],['\uf186',-.2,1.45,'#f3ead9',.55],['\uf552',.95,1.45,'#912501',.9]];
    var out=[];for(var n=0;n<q.length;n++)out.push({ch:q[n][0],w:900,x:bx+q[n][1]*bs,y:by+q[n][2]*bs,s:bs*q[n][4],rot:(n%2?1:-1)*(8+n*6),c:q[n][3],o:1});
    return out;
  }

  var fontsP;
  function fonts(){
    if(!fontsP)fontsP=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('900 40px '+FAM,'\uf187'),document.fonts.load('400 40px '+FAM,'\uf005')]).catch(function(){}):Promise.resolve();
    return fontsP;
  }

  // Painted a few hundred icons per frame so phones never stall; the box shows once the field is done.
  var job=0;
  function paint(W,H,done){
    var my=++job,dpr=Math.min(2,window.devicePixelRatio||1),ctx=cv.getContext('2d');
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
    var D=Math.PI/180,i=0;
    function step(){
      if(my!==job)return;
      ctx.textAlign='center';ctx.textBaseline='middle';
      var cw=0,end=Math.min(items.length,i+200);
      for(;i<end;i++){var it=items[i];
        if(it.w!==cw){cw=it.w;ctx.font=cw+' 100px '+FAM;}
        var a=it.rot*D,sc=it.s/100*dpr,co=Math.cos(a)*sc,si=Math.sin(a)*sc;
        ctx.setTransform(co,si,-si,co,it.x*dpr,it.y*dpr);ctx.globalAlpha=it.o;ctx.fillStyle=it.c;ctx.fillText(it.ch,0,0);
      }
      ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
      if(i<items.length)requestAnimationFrame(step);else done();
    }
    requestAnimationFrame(step);
  }

  function glyphEl(it,cls){
    var e=document.createElement('span');e.className='s-g '+cls;e.textContent=it.ch;e.setAttribute('aria-hidden','true');
    e.style.cssText='left:'+it.x.toFixed(1)+'px;top:'+it.y.toFixed(1)+'px;font-weight:'+it.w+';font-size:'+it.s.toFixed(1)+'px;color:'+it.c+';opacity:'+it.o.toFixed(2)+';transform:translate(-50%,-50%) rotate('+it.rot.toFixed(1)+'deg)';
    return e;
  }

  function build(){
    var W=field.clientWidth,H=Math.max(900,Math.round(window.innerHeight*1.6));
    if(W===lastW&&built)return;lastW=W;built=1;
    field.style.height=H+'px';
    var old=field.querySelectorAll('.s-g,.s-box');for(var o=0;o<old.length;o++)field.removeChild(old[o]);
    var f=Math.max(.62,Math.min(1.05,W/1440));
    bs=Math.round(W<700?40:Math.max(44,48*f));                     // box image size in px
    var bx=BOX.x*W,by=BOX.y*H;
    items=layout(W,H).concat(nearBox(bx,by));
    cv.setAttribute('data-n',items.length);
    var b=document.createElement('button');b.type='button';b.className='s-box';b.setAttribute('aria-label','Loot box 38');
    b.style.cssText='left:'+(bx-bs/2-6)+'px;top:'+(by-bs/2-6)+'px;width:'+(bs+12)+'px;z-index:3;visibility:hidden;transform:rotate('+BOX.rot+'deg)';
    b.innerHTML='<img src="https://africhmaurice.github.io/leaderboard/loot/38.png" alt="Loot box 38" draggable="false">';
    field.appendChild(b);
    // A leaf and a feather tucked over its corners: seen above the box, never in the way of a tap.
    field.appendChild(glyphEl({ch:'\uf06c',w:900,x:bx-bs*.4,y:by-bs*.38,s:bs*.6,rot:-30,c:'#57bb41',o:.97},'cvr'));
    field.appendChild(glyphEl({ch:'\uf52d',w:900,x:bx+bs*.44,y:by+bs*.32,s:bs*.55,rot:40,c:'#c3a6ff',o:.95},'cvr'));
    fonts().then(function(){if(lastW===W)paint(W,H,function(){b.style.visibility='';});});
  }
  build();
  var tm;window.addEventListener('resize',function(){clearTimeout(tm);tm=setTimeout(build,200);});

  field.addEventListener('click',function(ev){
    var t=ev.target;
    if(t.closest&&t.closest('.s-box')){
      var k='Qjk4N1BEWFU9Yz90b29sL21vYy5oY2lyZmFlY2lydWFtLnd3dy8vOnNwdHRo';
      if(/africhmaurice.github.io/.test(location.host)){alert('Preview: this is where loot box 38 opens.');return;}
      location.href=atob(k).split('').reverse().join('');return;
    }
    // Any other icon gives a little wiggle: lift the topmost one under the tap.
    var r=field.getBoundingClientRect(),px=ev.clientX-r.left,py=ev.clientY-r.top;
    for(var i=items.length-1;i>=0;i--){var it=items[i],dx=it.x-px,dy=it.y-py,rr=it.s*.42;
      if(dx*dx+dy*dy<rr*rr){var e=glyphEl(it,'pop');e.style.opacity='1';field.appendChild(e);
        setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);},560);return;}
    }
  });
})();
</script>
