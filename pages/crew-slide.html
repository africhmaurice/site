<!-- ============================================================
     THE CREW SLIDE PUZZLE - hidden page for loot box 146 ("Put the crew back together."). Lives at /crew-slide.
     A 6 by 5 sliding tile puzzle (6 across, 5 down; the same approach as Sixteen Pieces, pages/sixteen.html): twenty-nine
     tiles and one gap. It was 4 by 4 (fifteen tiles) until Maurice 10/26: "make the crew slide puzzle double the pieces."
     6 by 5 suits the 16:10 picture: each tile is 4:3 (a little wider than tall), and on a 390px phone the board fills the
     width (16px gutters under 480px) at about 59 x 43px per tile, still big enough to tap. (8 by 4 would make tall, thin tiles; 6 by 6 squashes them.)
     The picture is the kid crew, built from Maurice's public kid crew stickers (assets/games/80-kid-*.webp, the art on
     Match the Crest and the Kid Crew Sticker Set) over a violet sky was the first picture; Maurice 10/26: "use the adult crew art", so it is
     now his adult crew lineup on its white background, not cut out (Maurice 10/26), from the original of his Spot the
     Differences pair, 1440 x 900: assets/games/146-crew-adult.webp.
     Scrambles are made by 600 random legal moves from the finished picture (240 on the old 4 by 4), so every deal can be solved.
     Click or tap a tile next to the gap to slide it in (arrow keys work too). When every tile is home the last tile
     fills in, then loot box 146 drops in below; clicking the chest opens the claim link.
     Test hook: ?test=1 exposes window.__crewSlide.solution() (the scramble played backward) for the test harness.
     Plain white tiles (0, 1, 2, 23, and the gap 29) count in any white spot. The board saves on the device after every move (localStorage maCrewSlide).
     DRAFT (all words on this page are new, for Maurice to approve):
       heading "The Crew Slide Puzzle"; line "Slide the tiles into the gap. Put the crew back together.";
       counter "Moves"; button "Restart"; thumbnail label "The crew"; win line "The crew is back together. Box 146 is yours.".
     ============================================================ -->

<style>
@font-face{font-family:'Cracked Imperia';src:url('https://africhmaurice.github.io/site/assets/fonts/CrackedImperia-Bold.woff2') format('woff2');font-weight:100 900;font-display:block;size-adjust:109.5%}
#ma-crewslide{width:100vw;position:relative;left:50%;margin-left:-50vw;box-sizing:border-box;min-height:100vh;overflow-x:hidden;
  padding:clamp(120px,14vh,160px) 20px 80px;background-color:#0b170f;background-image:radial-gradient(ellipse at 50% 0%,rgba(45,28,83,.55) 0%,rgba(11,23,15,0) 62%),linear-gradient(rgba(11,23,15,0.76),rgba(11,23,15,0.76)),url(https://africhmaurice.github.io/site/assets/bg/d/city-skyline-panorama-as348070597.webp);background-position:center;background-size:cover;background-repeat:no-repeat;background-attachment:scroll;
  color:#f3ead9;font-family:'Almarai',sans-serif;text-align:center}
#ma-crewslide *{box-sizing:border-box;border-radius:0}
@media (max-width:900px){#ma-crewslide{background-image:radial-gradient(ellipse at 50% 0%,rgba(45,28,83,.55) 0%,rgba(11,23,15,0) 62%),linear-gradient(rgba(11,23,15,0.76),rgba(11,23,15,0.76)),url(https://africhmaurice.github.io/site/assets/bg/m/city-skyline-panorama-as348070597.webp)}}
#ma-crewslide [hidden]{display:none!important}
#ma-crewslide .cs-wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px}
#ma-crewslide h1{margin:0;font-family:'Cracked Imperia',Impact,sans-serif;font-weight:400;font-size:clamp(36px,6vw,64px);line-height:1.2;letter-spacing:.04em;text-transform:uppercase;color:#fffffe}
#ma-crewslide .cs-lede{margin:0;font-weight:700;font-size:clamp(16px,1.8vw,19px);line-height:1.5;max-width:560px}
#ma-crewslide .cs-bar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px 24px;font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
#ma-crewslide .cs-bar b{color:#c3a6ff;font-weight:800}
#ma-crewslide .cs-btn{margin:0;padding:10px 18px;border:1px solid rgba(243,234,217,.45);background:none;color:#f3ead9;font:800 13px/1.2 'Almarai',sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;touch-action:manipulation}
#ma-crewslide .cs-btn:hover,#ma-crewslide .cs-btn:focus-visible{border-color:#c3a6ff;color:#c3a6ff;outline:none}
#ma-crewslide .cs-thumb{display:flex;align-items:center;gap:10px}
#ma-crewslide .cs-thumb img{width:70px;height:44px;display:block;border:1px solid rgba(243,234,217,.45)}
#ma-crewslide .cs-board{position:relative;width:min(640px,calc(100vw - 40px));aspect-ratio:16/10;background:#0b170f;border:3px solid #f3ead9;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#ma-crewslide .cs-tile{position:absolute;width:calc(100% / 6);height:20%;margin:0;padding:0;border:1px solid #0b170f;background-color:#482d85;background-image:url('https://africhmaurice.github.io/site/assets/games/146-crew-adult.webp');background-size:600% 500%;cursor:pointer;transition:left .13s ease,top .13s ease}
#ma-crewslide .cs-tile:focus-visible{outline:3px solid #c3a6ff;outline-offset:-3px}
#ma-crewslide .cs-board.solved .cs-tile{cursor:default}
#ma-crewslide .cs-board.done .cs-tile{border-color:transparent}
#ma-crewslide .cs-tile.cs-last{opacity:0;pointer-events:none;transition:opacity .6s ease}
#ma-crewslide .cs-win{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:8px}
#ma-crewslide .cs-win p{margin:0;font-family:'Cracked Imperia',Impact,sans-serif;font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.25;letter-spacing:.04em;text-transform:uppercase;color:#89fbcb}
#ma-crewslide .cs-box{border:0;background:none;padding:0;margin:0;cursor:pointer;width:min(58vw,280px);animation:csDrop .6s cubic-bezier(.25,1.5,.45,1) both}
#ma-crewslide .cs-box img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 34px rgba(123,78,225,.55))}
#ma-crewslide .cs-box:hover img,#ma-crewslide .cs-box:focus-visible img{filter:drop-shadow(0 0 44px rgba(195,166,255,.75))}
#ma-crewslide .cs-box:focus-visible{outline:3px solid #c3a6ff;outline-offset:8px}
@keyframes csDrop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@media (max-width:480px){#ma-crewslide{padding-left:16px;padding-right:16px}#ma-crewslide .cs-board{width:calc(100vw - 32px)}}
@media (prefers-reduced-motion:reduce){#ma-crewslide .cs-tile{transition:none}#ma-crewslide .cs-box{animation:none}}
</style>
<section id="ma-crewslide" aria-label="The Crew Slide Puzzle">
  <div class="cs-wrap">
    <h1>The Crew Slide Puzzle</h1>
    <p class="cs-lede">Slide the tiles into the gap. Put the crew back together.</p>
    <div class="cs-bar"><span>Moves <b class="cs-moves">0</b></span><span class="cs-thumb">The crew <img src="https://africhmaurice.github.io/site/assets/games/146-crew-adult.webp" alt="The finished picture"></span><button class="cs-btn cs-restart" type="button">Restart</button></div>
    <div class="cs-board" role="group" aria-label="Sliding puzzle, six across by five down"></div>
    <div class="cs-win" role="status" hidden>
      <p>The crew is back together. Box 146 is yours.</p>
      <button class="cs-box" type="button" aria-label="Open loot box 146"><img src="https://africhmaurice.github.io/site/assets/loot/146.png" alt="Loot box 146"></button>
    </div>
  </div>
</section>
<script>
(function(){
  var d=document.getElementById('ma-crewslide');if(!d)return;
  var sec=d.closest('section.page-section')||(d.parentElement&&d.parentElement.closest('section'));if(sec&&sec!==d){sec.style.background='#0b170f';sec.style.minHeight='0';Array.prototype.forEach.call(sec.querySelectorAll('.section-background,.section-border'),function(x){x.style.display='none';});}
  var cw=d.closest('.content-wrapper');if(cw){cw.style.padding='0';cw.style.maxWidth='none';}var fe=d.closest('.fluid-engine');if(fe)fe.style.display='block';
  document.documentElement.style.background=document.body.style.background='#0b170f';

  var K='Q01TWDM0UUY9Yz90b29sL21vYy5oY2lyZmFlY2lydWFtLnd3dy8vOnNwdHRo';
  function claim(){var u='';try{u=atob(K).split('').reverse().join('');}catch(e){}if(!u)return;
    var w=null;try{w=window.open(u,'_blank');if(w)w.opener=null;}catch(e){}if(!w)location.href=u;}

  var N=6,ROWS=5,CELLS=N*ROWS,LAST=CELLS-1,board=d.querySelector('.cs-board'),movesEl=d.querySelector('.cs-moves'),win=d.querySelector('.cs-win');
  var tiles=[],pos=[],gap,moves=0,locked=false,trail=[];
  function place(t){tiles[t].style.left=(pos[t]%N)*100/N+'%';tiles[t].style.top=Math.floor(pos[t]/N)*100/ROWS+'%';}
  function nextTo(a,b){return Math.abs(a%N-b%N)+Math.abs(Math.floor(a/N)-Math.floor(b/N))===1;}
  // Tiles 0, 1, 2, 23, and 29 (the gap) are plain white, so any of them counts in any of those spots.
  var BLANK=[0,1,2,23,LAST];
  function blank(i){return BLANK.indexOf(i)>=0;}
  function inPlace(){if(!blank(gap))return false;for(var t=0;t<LAST;t++)if(blank(t)?!blank(pos[t]):pos[t]!==t)return false;return true;}
  function slide(t,counted){
    if(locked||!nextTo(pos[t],gap))return false;
    var c=pos[t];pos[t]=gap;gap=c;place(t);
    if(counted){moves++;movesEl.textContent=moves;store();if(inPlace())finish();}
    return true;
  }
  // Scrambled by legal moves from the finished picture (never undoing the last move), so it can always be solved.
  function deal(){
    locked=false;board.classList.remove('solved','done');win.hidden=true;tiles[LAST].classList.add('cs-last');
    pos[LAST]=LAST;place(LAST);
    for(var t=0;t<LAST;t++)pos[t]=t;gap=LAST;trail=[];
    var last=-1;
    for(var i=0;i<600||inPlace();i++){
      var opts=[];for(var u=0;u<LAST;u++)if(u!==last&&nextTo(pos[u],gap))opts.push(u);
      var pick=opts[Math.floor(Math.random()*opts.length)];slide(pick,false);trail.push(pick);last=pick;
    }
    for(t=0;t<LAST;t++)place(t);moves=0;movesEl.textContent='0';store();
  }
  // Saves the board on this device after every move, so a refresh picks up where it left off.
  var SAVE='maCrewSlide';
  function store(){try{localStorage.setItem(SAVE,JSON.stringify({p:pos.slice(0,LAST),g:gap,m:moves}));}catch(e){}}
  function restore(){
    var v=null;try{v=JSON.parse(localStorage.getItem(SAVE));}catch(e){}
    if(!v||!Array.isArray(v.p)||v.p.length!==LAST)return false;
    var seen={},all=v.p.concat([v.g]);
    for(var i=0;i<all.length;i++){var c=all[i];if(c!==(c|0)||c<0||c>=CELLS||seen[c])return false;seen[c]=1;}
    for(var t=0;t<LAST;t++){pos[t]=v.p[t];place(t);}gap=v.g;trail=[];
    moves=Math.max(0,v.m|0);movesEl.textContent=moves;return true;
  }
  function finish(){
    locked=true;board.classList.add('solved');
    pos[LAST]=gap;place(LAST);
    setTimeout(function(){tiles[LAST].classList.remove('cs-last');board.classList.add('done');},120);
    setTimeout(function(){win.hidden=false;},800);
  }
  for(var t=0;t<CELLS;t++)(function(t){
    var b=document.createElement('button');b.type='button';b.className='cs-tile';
    b.style.backgroundPosition=(t%N)*100/(N-1)+'% '+Math.floor(t/N)*100/(ROWS-1)+'%';
    b.setAttribute('aria-label','Tile '+(t+1));
    if(t===LAST){b.classList.add('cs-last');b.tabIndex=-1;b.style.left=(N-1)*100/N+'%';b.style.top=(ROWS-1)*100/ROWS+'%';}
    else b.addEventListener('click',function(){slide(t,true);});
    board.appendChild(b);tiles[t]=b;
  })(t);
  if(!restore())deal();else if(inPlace())finish();
  d.querySelector('.cs-restart').onclick=deal;
  d.querySelector('.cs-box').onclick=claim;
  // Arrow keys slide the tile on that side of the gap into it.
  document.addEventListener('keydown',function(e){
    var dd={ArrowLeft:1,ArrowRight:-1,ArrowUp:N,ArrowDown:-N}[e.key];if(!dd||locked)return;
    var from=gap+dd;if(from<0||from>=CELLS||(Math.abs(dd)===1&&Math.floor(from/N)!==Math.floor(gap/N)))return;
    for(var t=0;t<LAST;t++)if(pos[t]===from){e.preventDefault();slide(t,true);break;}
  });
  if(/[?&]test=1(&|$)/.test(location.search))window.__crewSlide={solution:function(){return trail.slice().reverse();}};
})();
</script>
