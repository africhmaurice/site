<!-- ============================================================
     SKY RUN - a cinematic seven-leg voyage aboard a Sky Pirates of Imperia airship.
     1) Orders screen: each visitor is assigned a Ship, Deck, and Watch, seeded from a random id
        saved in localStorage (ma-skyrun-crew), so it never changes for that browser.
     2) Seven legs (S object): full-bleed backdrop, short text, 2-3 choices. Wrong choices kill you
        (D object) and lock the game for 4 hours (localStorage ma-skyrun-dead), with a live countdown.
        Some good choices pay a Crew Commendation code word (X object) and then the voyage continues.
     3) Survive leg seven: Crew Papers (Rank, Call Sign, Sky Color, Home Port, also seeded) with a
        PNG download drawn on a canvas.
     ============================================================ -->

<script>
(function(){
  var root=document.getElementById('ma-skyrun');if(!root)return;
  var inner=root.querySelector('.sr-inner'), bgs=root.querySelectorAll('.sr-bg');
  var LOCK_MS=4*60*60*1000, LOCK_KEY='ma-skyrun-dead', LAST_KEY='ma-skyrun-lastdeath', RUN_KEY='ma-skyrun-run', ID_KEY='ma-skyrun-crew', PAPERS_KEY='ma-skyrun-papers';
  var memDead=0, memId='', timer=null, busy=false, bgOn=0, curBg='';

  // ---------- STORAGE ----------
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
  function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
  function ssSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
  function ssDel(k){try{sessionStorage.removeItem(k);}catch(e){}}
  function deadAt(){var v=parseInt(lsGet(LOCK_KEY),10);if(!(v>0))v=memDead;return v>0?v:0;}
  function lockLeft(){var d=deadAt();if(!d)return 0;var l=d+LOCK_MS-Date.now();return l>0?l:0;}

  // ---------- THE CREW ASSIGNMENT (seeded from a saved random id) ----------
  var SHIPS=['The Brass Petrel','The Crooked Lantern','The Ember Gull','The Widow\'s Kite','The Copper Saint','The Ninth Gale'];
  var DECKS=['Fore Deck','Aft Deck','Rigging','Engine Deck','Gunnery','Galley'];
  var WATCHES=['First Watch','Second Watch','Dog Watch','Night Watch'];
  var RANKS=['Powder Monkey','Deckhand','Able Skyhand','Rigger','Gunner\'s Mate','Helm\'s Mate','Lamplighter','Bosun\'s Shadow'];
  var CALL_A=['Lucky','Quiet','Crooked','Red','Salt','Iron','Little','Lone','Grim','Brass','Soot','Wild'];
  var CALL_B=['Wick','Gull','Rook','Cinder','Moth','Hook','Skipjack','Patch','Bramble','Kettle','Thistle','Sparrow'];
  var SKIES=[['Ember Dawn','#ff4c0f'],['Violet Dusk','#7b4ee1'],['Emerald Squall','#268e62'],['Green Flash','#57bb41'],['Mint Aurora','#89fbcb'],['Lavender Haze','#c3a6ff']];
  var PORTS=['Port Kettle','Grayhollow','Saltmere','Lanternfall','Brassgate','Thimble Rock','Highreach','Cinder Quay'];
  function crewId(){var id=lsGet(ID_KEY)||memId;if(!id){id='';var a='abcdefghijklmnopqrstuvwxyz0123456789';for(var i=0;i<16;i++)id+=a.charAt(Math.floor(Math.random()*a.length));memId=id;lsSet(ID_KEY,id);}return id;}
  function seeded(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
    return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;var t=(h>>>0)+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
  function crew(){var r=seeded(crewId());function p(a){return a[Math.floor(r()*a.length)];}
    var c={ship:p(SHIPS),deck:p(DECKS),watch:p(WATCHES),rank:p(RANKS)};c.call=p(CALL_A)+' '+p(CALL_B);var s=p(SKIES);c.sky=s[0];c.acc=s[1];c.port=p(PORTS);return c;}
  var C=crew();

  // ---------- BACKDROPS ----------
  var BG={arch:'neon-tunnel-arch-as468986961',city:'city-skyline-panorama-as348070597',canyon:'monolith-canyon-as444233611',foundry:'gyroscope-foundry-as401944302',storm:'nebula-glow-as332921866',blocks:'floating-blocks-city-as311317794',dome:'dome-city-mist-as159145789',crystal:'crystal-towers-lake-as395045722',island:'overgrown-sphere-as470076105',reef:'red-sun-ruins-as360866146',vault:'cavern-ruins-as581365050',garden:'garden-city-towers'};
  function bgUrl(k){return 'https://africhmaurice.github.io/site/assets/bg/'+(window.innerWidth<=700?'m':'d')+'/'+BG[k]+'.webp';}
  var pre={};function preload(k){if(!k||pre[k])return;pre[k]=1;var i=new Image();i.src=bgUrl(k);}
  function setBg(k){if(k===curBg)return;curBg=k;var nx=bgs[1-bgOn];nx.style.backgroundImage='url("'+bgUrl(k)+'")';nx.classList.add('on');bgs[bgOn].classList.remove('on');bgOn=1-bgOn;}

  // ---------- THE VOYAGE ----------
  var LEGS=['','The First Leg','The Second Leg','The Third Leg','The Fourth Leg','The Fifth Leg','The Sixth Leg','The Seventh Leg'];
  var DECKLINE={'Fore Deck':'Your sea bag lands on the fore deck, up front where the wind hits first.','Aft Deck':'Your sea bag lands on the aft deck, right under the captain\'s windows. Lucky you.','Rigging':'Your sea bag lands at the foot of the mainmast. The rigging crew sleeps closest to the sky.','Engine Deck':'Your sea bag lands by the engine hatch. It is warm down there, and it hums.','Gunnery':'Your sea bag lands between two cannons named Molly and Also Molly.','Galley':'Your sea bag lands in the galley, next to a gray stew that seems to be watching you.'};
  // choice: {l:label, go:stage id | 'papers' | death id, set:flag, xp:commendation id, r:lead-in text for the next scene, need:flag}
  var S={
    s1:{n:1,bg:'city',t:'Castoff',p:function(f){return [DECKLINE[C.deck],'The mooring ropes groan. Below the dock, the city is a spill of lamps, and the clouds are already going pink.','The bosun bellows your name, gets it wrong, and points at a line snarled around a cleat. The ship is lifting, with or without you.'];},
      c:[{l:'Cut the line with your knife',go:'s2a',r:'The line parts with a crack like a whip. The ship leaps free, and the city drops away under your boots.'},
         {l:'Jump down to the dock and untangle it',go:'d_dock'},
         {l:'Leave it to the bosun and report below',go:'s2b',r:'You drop down the engine hatch into heat and noise. Up top, the bosun cuts the line himself and says something unkind about you.'}]},
    s2a:{n:2,bg:'canyon',t:'The Crow\'s Nest',p:['The captain sends you up the mast to keep watch. The ship threads a canyon of black stone teeth, close enough to scrape paint.','Through the spyglass, a sail. Black, with red trim. Following you, and gaining.'],
      c:[{l:'Ring the bell and warn the deck',go:'s3',set:'warned',r:'You ring that bell like it owes you money. The gunners run out the cannons, and the black sail falls back to think it over.'},
         {l:'Flash your lantern at them for parley',go:'s3',set:'parley',r:'The black sail answers with three slow flashes. Talk later. Then it peels away into the canyon mist.'},
         {l:'Lean out over the rail for a better look',go:'d_lean'}]},
    s2b:{n:2,bg:'foundry',t:'The Boiler Deck',p:['It is hot, loud, and smells like burnt toast and danger. A gyroscope the size of a house spins in the dark, keeping the whole ship upright.','The chief engineer shoves a wrench into your hands, points at a whistling lift-gas valve, and vanishes into the steam. The gauge needle is creeping into the red.','Somewhere behind the boilers, something taps. Tap. Tap-tap. Tap.'],
      c:[{l:'Give the valve one more good turn',go:'d_valve'},
         {l:'Stop and yell for the chief',go:'s3',xp:'x_boiler'},
         {l:'Follow the tapping',go:'s3',set:'compass',r:'Behind the boilers you find a stowaway, a wiry girl in a soot-black coat, clutching a brass compass. "The needle never points north," she whispers. "It points at whatever the sky is hiding." She presses it into your hand and disappears into the coal.'}]},
    s3:{n:3,bg:'storm',t:'The Bruise-Colored Storm',p:function(f){return [(f.warned?'The crew is still buzzing from the canyon when the':'The')+' sky ahead turns violet, then green, then a color nobody has a name for.','The bosun clips a safety line to your belt and shoves you up the ratlines. Rain comes in sideways. Above you, the topsail tears with a sound like a giant ripping a bedsheet.','If that sail stays on, it drags the whole ship over. You are the closest one to it.'];},
      c:[{l:'Cut the torn sail loose',go:'s4',xp:'x_storm'},
         {l:'Grab the sail and hold on tight',go:'d_kite'},
         {l:'Climb down and shout for help',go:'s4',r:'Somebody else cuts the sail. The ship rights herself. You are alive, which on this ship counts as a good review.'}]},
    s4a:{n:4,bg:'blocks',t:'Boarders',p:['You burst out of the storm into a field of floating stone blocks, and right into the arms of the black sail.','Grappling hooks bite the rail. Rival pirates pour over the side, yelling and swinging. A loose rope dangles from the mainmast. The powder room door hangs open.'],
      c:[{l:'Grab the rope and swing over for their flag',go:'s5',xp:'x_flag'},
         {l:'Guard the powder room with a lantern',go:'d_powder'},
         {l:'Hack through their grappling lines',go:'s5',r:'One line. Two. Five. The black sail drifts off without its boarders, who suddenly become very polite and offer to scrub the deck.'}]},
    s4b:{n:4,bg:'dome',t:'The Black Sail Returns',p:['You burst out of the storm beside a misty dome city. The black sail from the canyon is waiting, cannons quiet, lantern lit.','Their captain leans on the rail in a hat with a feather the length of a broom. "You flashed for parley, little one. Talk."'],
      c:[{l:'Tell them that hat is ridiculous',go:'d_hat'},
         {l:'Trade them news of the storm behind you',go:'s5',set:'tip',xp:'x_silver'},
         {l:'Offer them a bowl of the galley stew',go:'s5',r:'They taste it, turn the color of the storm, and sail off without another word. Diplomacy, of a kind.'}]},
    s5:{n:5,bg:'crystal',t:'Something Below',p:function(f){var a=['The air goes still over a glassy sea of cloud. Crystal spires poke through it like the masts of sunken ships.','Then the ship lurches. Something wet and enormous wraps the hull. Tentacles, each as thick as a mast. A yellow eye the size of a door rises over the rail.'];
        if(f.tip)a.push('The rival captain\'s parting words ring in your ears: "Kraken grounds ahead. If one grabs you, go for the eye."');return a;},
      c:[{l:'Brace a harpoon on the rail and aim for the eye',go:'s6',xp:'x_kraken'},
         {l:'Bang pots and pans at it',go:'s6',r:'The kraken flinches. It did not expect percussion. It lets go and sinks, sulking, back into the clouds.'},
         {l:'Hide in a barrel until it leaves',go:'d_barrel'}]},
    s6:{n:6,bg:'island',t:'The Island the Map Forgot',p:function(f){var a=['Fresh water is running low, so the captain drops anchor at a floating island on no chart. Roots hang off its edges into open sky.','Fruit glows on the trees like lanterns. Deep in the ruins, a great rusted lever has an arrow carved on it, pointing down.'];
        a.push(f.compass?'The compass in your pocket twitches, then settles. Not here. Not yet.':'Filling casks beside you, the cook mutters that a stowaway was hiding behind the boilers when you cast off. "Swears her compass knows where the old treasure fell."');return a;},
      c:[{l:'Eat one of the glowing fruits',go:'d_fruit'},
         {l:'Pull the great lever',go:'d_lever'},
         {l:'Fill the water casks and row back',go:'s7',r:'Boring. Sensible. Alive. The quartermaster nods at you, which from her is basically a parade.'}]},
    s7:{n:7,bg:'reef',t:'The Red Sun Reef',p:function(f){var a=['Home port is close. Between you and it drifts the Reef, a field of broken towers floating under a swollen red sun.','The captain hands you the wheel. "Bring her in." On the chart, someone drew two courses: a neat straight line, and a crooked one scribbled in the margin beside the words Only fools sail straight.'];
        if(f.compass)a.push('In your pocket, the compass is humming. The needle points straight down, over the rail, at a dark gap in the oldest tower.');return a;},
      c:[{l:'Steer straight for the harbor lights',go:'d_straight'},
         {l:'Follow the crooked course',go:'papers'},
         {l:'Hand off the wheel and follow the needle over the rail',go:'s8',need:'compass'}]},
    s8:{n:8,bg:'vault',t:'Under the Oldest Tower',secret:true,p:['You go over the rail on a rope, then off the end of the rope, then onto a ledge you are fairly sure was not there a second ago.','Inside the tower, a vault glitters. Gold coins are piled waist-high on a stone pedestal. In the corner, ignored for a hundred years, sits one small, battered box with a lock shaped like a compass rose.','The needle spins once and points at the box.'],
      c:[{l:'Scoop up an armful of gold',go:'d_gold'},
         {l:'Open the battered little box',go:'loot'}]}
  };
  S.s3.c.forEach(function(c){if(c.go==='s4')c.go='s4?';});
  function resolve(go,f){return go==='s4?'?(f.parley?'s4b':'s4a'):go;}

  var D={
    d_dock:{t:'Left at the Dock, Sort Of',p:['You untangle the line beautifully. The ship rises. You are still holding the line.','You hang on for a mile, then a mile and a half. The city gets very small, and then very large again.']},
    d_lean:{t:'Just a Little Further',p:['You lean out. A little further. Just a little further.','The canyon wall has been waiting a long time to meet someone like you.']},
    d_valve:{t:'Lefty Loosey Was Right',p:['One more turn. The valve pops off like a champagne cork.','You leave through the deck, the galley, the captain\'s cabin, and one very surprised seagull. Nobody ever finds the wrench.']},
    d_kite:{t:'Human Kite',p:['You hold on. The sail does not.','You fly beautifully for eleven miles. Some farmers wave. Then the wind gets bored.']},
    d_powder:{t:'Lights Out',p:['The powder room is dark, so you hold up your lantern to see.','You see.']},
    d_hat:{t:'Fashion Critic',p:['The deck goes silent. The rival captain strokes the feather.','"It is a magnificent hat," they say, and fire both pistols.']},
    d_barrel:{t:'Snack Size',p:['You curl up inside the barrel and hold very still.','The kraken picks up the barrel, sniffs it, and swallows it whole like a pickle.']},
    d_fruit:{t:'Glow Up',p:['The fruit tastes like sunshine and peppermint. You feel amazing.','You also start glowing. Then floating. You drift up past the clouds and become a very small, very confused star.']},
    d_lever:{t:'Going Down',p:['You pull the lever. Deep inside the island, a very old engine stops.','The island starts to fall, and so do you. It is a long way down, and you have plenty of time to think about arrows.']},
    d_straight:{t:'Straight Shot',p:['You aim dead center for the lights and hold the wheel steady.','The Reef admires your confidence and meets you halfway. Only fools sail straight.']},
    d_gold:{t:'Greedy Hands',p:['You scoop up the gold. The pedestal clicks.','The ceiling comes down to meet you. Rich, briefly.']},
    d_locked:{t:'Still Drifting',p:['Your last voyage ended badly. The sky has not let go of you yet.','Rest up, sky pirate. The ship will wait.']}
  };
  var DEATH_BG={d_dock:'city',d_lean:'canyon',d_valve:'foundry',d_kite:'storm',d_powder:'blocks',d_hat:'dome',d_barrel:'crystal',d_fruit:'island',d_lever:'island',d_straight:'reef',d_gold:'vault',d_locked:'storm'};

  var X={
    x_boiler:{code:'BOILERHEART',t:'The Chief Approves',p:['The chief sprints out of the steam, taps the gauge twice, and backs the valve off a quarter turn. The whistle dies.','"You stopped. Most new ones don\'t stop." She hands you a scorched leather glove. On the engine deck, that is a hug.']},
    x_storm:{code:'STORMBREAKER',t:'The Sail That Saved Us',p:['The torn sail whips away into the storm, and the ship rights herself with a groan you feel in your teeth.','The captain writes your name in the logbook. In ink. Not pencil. Ink.']},
    x_flag:{code:'FLAGSNATCHER',t:'Their Colors, Our Galley',p:['You swing home with the rival flag clenched in your teeth. They see it, lose their nerve, and flee.','The flag now hangs in the galley, where the cook uses it as a dish towel. That is the highest honor on board.']},
    x_silver:{code:'SILVERTONGUE',t:'A Fair Trade',p:['You warn them about the storm. They warn you about the kraken grounds. Both crews live to steal another day.','The rival captain tips that ridiculous hat at you as they sail off.']},
    x_kraken:{code:'KRAKENBANE',t:'One Shot',p:['The harpoon flies true. The kraken shrieks, lets go, and sinks back into the clouds.','The crew paints a tiny tentacle on your hammock. It means you are one of them now.']}
  };

  // ---------- RUN STATE ----------
  var run=null; // {s:stage id, f:{flags}, xp:[codes], r:lead text}
  function newRun(){return {s:'s1',f:{},xp:[],r:''};}
  function save(){if(run)ssSet(RUN_KEY,JSON.stringify(run));}

  // ---------- HELPERS ----------
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var wordN=0;
  function words(s){var out='',a=String(s).split(' ');for(var i=0;i<a.length;i++){out+='<span class="w" style="animation-delay:'+Math.min(wordN*28,4200)+'ms">'+esc(a[i])+'</span>'+(i<a.length-1?' ':'');wordN++;}return out;}
  function paras(a,anim){var h='';for(var i=0;i<a.length;i++)h+='<p>'+(anim?words(a[i]):esc(a[i]))+'</p>';return h;}
  function fmt(ms){var s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+(m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
  var ORN='<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 36V4h32"/><path d="M10 30V10h20" stroke-width="1"/><rect x="1" y="1" width="8" height="8" fill="currentColor" stroke="none" transform="rotate(45 5 5)"/><path d="M16 4c0 7 5 12 12 12" stroke-width="1"/></svg>';
  function frame(cls,acc,body){return '<div class="sr-frame '+(cls||'')+'"'+(acc?' style="--acc:'+acc+'"':'')+'><span class="sr-orn tl">'+ORN+'</span><span class="sr-orn tr">'+ORN+'</span><span class="sr-orn bl">'+ORN+'</span><span class="sr-orn br">'+ORN+'</span>'+body+'</div>';}
  function rule(){return '<div class="sr-rule" aria-hidden="true"><i></i></div>';}
  function notches(n,secret){var h='<div class="sr-notches" aria-label="Leg '+Math.min(n,7)+' of 7">';for(var i=1;i<=7;i++)h+='<span class="sr-notch'+(i<n||secret?' done':i===n?' cur':'')+'"></span>';if(secret)h+='<span class="sr-notch secret"></span>';return h+'</div>';}
  function clearTimer(){if(timer){clearInterval(timer);timer=null;}}
  function mode(m){root.classList.remove('is-death','is-xp','is-loot');if(m)root.classList.add('is-'+m);}

  // Fade out, swap, fade in.
  function show(bgKey,m,html,after){
    clearTimer();busy=true;
    if(bgKey)setBg(bgKey);
    inner.classList.add('out');
    setTimeout(function(){
      mode(m);inner.classList.remove('sr-skip');inner.innerHTML=html;
      var top=root.getBoundingClientRect().top;if(top<-40)root.scrollIntoView({behavior:'smooth',block:'start'});
      inner.classList.remove('out');busy=false;if(after)after();
    },inner.innerHTML?600:0);
  }

  // ---------- SCREENS ----------
  function viewAssign(){
    run=null;ssDel(RUN_KEY);preload('city');
    var body='<p class="sr-eye">Sky Run</p><h2 class="sr-title">Your Orders, Sky Pirate</h2><p class="sr-small">I signed you aboard. The ink is still wet.</p>'+rule()+
      '<div class="sr-fields"><div class="sr-field"><span>Ship</span><strong>'+esc(C.ship)+'</strong></div><div class="sr-field"><span>Deck</span><strong>'+esc(C.deck)+'</strong></div><div class="sr-field"><span>Watch</span><strong>'+esc(C.watch)+'</strong></div></div>'+
      '<p class="sr-small">Seven legs to home port. Survive them all and the crew writes you papers. Fall, and the sky keeps you for four hours.</p>'+
      '<div class="sr-btns"><button type="button" class="sr-btn" data-act="board">Board the Ship</button></div>';
    show('arch','',frame('sr-assign','',body));
  }

  function viewStage(){
    var sc=S[run.s];if(!sc){run=newRun();sc=S.s1;}
    var f=run.f, p=typeof sc.p==='function'?sc.p(f):sc.p;wordN=0;
    var html='<div class="sr-top">'+notches(sc.n,sc.secret)+'<button type="button" class="sr-link" data-act="over">Start over</button></div>'+
      '<p class="sr-eye">'+(sc.secret?'A Secret Leg':LEGS[sc.n])+'</p><h2 class="sr-title">'+esc(sc.t)+'</h2>'+
      (run.r?'<p class="sr-lead">'+esc(run.r)+'</p>':'')+'<div class="sr-text" data-act="skip">'+paras(p,true)+'</div><div class="sr-choices">';
    var k=0;
    for(var i=0;i<sc.c.length;i++){var c=sc.c[i];if(c.need&&!f[c.need])continue;
      html+='<button type="button" class="sr-choice'+(c.need?' secret':'')+'" data-i="'+i+'"><b>'+'ABC'.charAt(k++)+'</b><span>'+esc(c.l)+'</span></button>';
      var nx=resolve(c.go,f);preload(S[nx]?S[nx].bg:nx==='papers'?'garden':DEATH_BG[nx]);}
    html+='</div>';
    show(sc.bg,'',html,function(){var ch=inner.querySelector('.sr-choices');if(ch)ch.style.animationDelay=Math.min(wordN*28,4200)+300+'ms';});
    save();
  }

  function viewDeath(id){
    var d=D[id]||D.d_locked;
    var body='<p class="sr-eye">Lost to the Sky</p><h2 class="sr-title">'+esc(d.t)+'</h2><div class="sr-text">'+paras(d.p)+'</div>'+
      '<div class="sr-lock"><p>The sky keeps the fallen a while. You can sail again in</p><div class="sr-clock">'+fmt(lockLeft()||LOCK_MS)+'</div><button type="button" class="sr-btn" data-act="again" hidden>Sail Again</button></div>';
    show(DEATH_BG[id]||'storm','death',frame('sr-death','#ff4c0f',body),tick);
  }
  function tick(){
    var clock=inner.querySelector('.sr-clock'),btn=inner.querySelector('[data-act="again"]');if(!clock)return;
    function upd(){var l=lockLeft();if(l>0){clock.textContent=fmt(l);btn.hidden=true;}else{clock.textContent='0:00:00';btn.hidden=false;clearTimer();}}
    upd();timer=setInterval(upd,1000);
  }

  function viewXp(id){
    var x=X[id];
    var body='<p class="sr-eye" style="color:#c3a6ff">Crew Commendation</p><h2 class="sr-title">'+esc(x.t)+'</h2><div class="sr-text">'+paras(x.p)+'</div>'+
      '<div class="sr-code">'+esc(x.code)+'</div><p class="sr-note">Post this code word in the Trench Discord for XP.</p>'+
      '<div class="sr-btns"><button type="button" class="sr-btn" data-act="cont">Back to the Voyage</button></div>';
    show(null,'xp',frame('sr-xp','#c3a6ff',body));
  }

  function viewLoot(){
    var body='<p class="sr-eye" style="color:#a2f590">Treasure</p><h2 class="sr-title">The Battered Box</h2><div class="sr-text">'+paras(['The compass-rose lock clicks open on its own, like it has been waiting for someone curious enough to skip the gold.','Inside is a loot box.'])+'</div>'+
      '<button type="button" class="sr-box" data-act="loot" aria-label="Open loot box 42"><img src="https://africhmaurice.github.io/leaderboard/loot/42.png" alt="Loot box 42"></button>'+
      '<p class="sr-note" style="color:#a2f590">Click the box to claim it.</p><div class="sr-btns"><button type="button" class="sr-btn" data-act="aboard">Climb Back Aboard</button></div>';
    preload('garden');
    show(null,'loot',frame('sr-loot','#a2f590',body));
  }

  function viewPapers(){
    var n=run&&run.xp?run.xp.length:parseInt(lsGet(PAPERS_KEY+'-xp'),10)||0;
    var body='<p class="sr-eye">The Sky Pirates of Imperia</p><h2 class="sr-title">Crew Papers</h2><p class="sr-small">Seven legs, all survived. The captain signs, the quartermaster stamps, and you are crew.</p>'+rule()+
      '<div class="sr-fields"><div class="sr-field wide"><span>Call Sign</span><strong>'+esc(C.call)+'</strong></div>'+
      '<div class="sr-field"><span>Ship</span><strong>'+esc(C.ship)+'</strong></div><div class="sr-field"><span>Rank</span><strong>'+esc(C.rank)+'</strong></div>'+
      '<div class="sr-field"><span>Deck</span><strong>'+esc(C.deck)+'</strong></div><div class="sr-field"><span>Watch</span><strong>'+esc(C.watch)+'</strong></div>'+
      '<div class="sr-field"><span>Sky Color</span><strong><i class="sr-swatch"></i>'+esc(C.sky)+'</strong></div><div class="sr-field"><span>Home Port</span><strong>'+esc(C.port)+'</strong></div></div>'+
      (n?'<p class="sr-small">Commendations this voyage: '+n+'</p>':'')+
      '<div class="sr-btns"><button type="button" class="sr-btn" data-act="png">Save My Papers</button><button type="button" class="sr-link" data-act="over">Sail again</button></div>';
    show('garden','',frame('sr-papers',C.acc,body));
  }

  // ---------- PAPERS PNG ----------
  function savePng(btn){
    var W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;var g=cv.getContext('2d');
    var fontsReady=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('60px "Atomic Marker"'),document.fonts.load('800 24px Almarai'),document.fonts.load('400 24px Almarai')]).catch(function(){}):Promise.resolve();
    var img=new Image();img.crossOrigin='anonymous';
    var imgReady=new Promise(function(res){img.onload=function(){res(true);};img.onerror=function(){res(false);};img.src='https://africhmaurice.github.io/site/assets/bg/d/'+BG.garden+'.webp?papers';});
    if(btn){btn.disabled=true;btn.textContent='Drawing...';}
    Promise.all([fontsReady,imgReady]).then(function(r){
      function draw(withImg){
        g.fillStyle='#0b170f';g.fillRect(0,0,W,H);
        if(withImg){var s=Math.max(W/img.width,H/img.height),iw=img.width*s,ih=img.height*s;g.drawImage(img,(W-iw)/2,(H-ih)/2,iw,ih);}
        var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(11,23,15,.86)');gr.addColorStop(.45,'rgba(11,23,15,.72)');gr.addColorStop(1,'rgba(11,23,15,.94)');g.fillStyle=gr;g.fillRect(0,0,W,H);
        g.strokeStyle='#f3ead9';g.lineWidth=4;g.strokeRect(48,48,W-96,H-96);
        g.strokeStyle=C.acc;g.lineWidth=2;g.strokeRect(66,66,W-132,H-132);
        [[48,48,1,1],[W-48,48,-1,1],[48,H-48,1,-1],[W-48,H-48,-1,-1]].forEach(function(c){g.save();g.translate(c[0],c[1]);g.scale(c[2],c[3]);g.fillStyle=C.acc;g.save();g.rotate(Math.PI/4);g.fillRect(-12,-12,24,24);g.restore();g.strokeStyle=C.acc;g.lineWidth=2;g.beginPath();g.moveTo(40,22);g.bezierCurveTo(40,60,60,80,100,80);g.stroke();g.restore();});
        g.textAlign='center';g.textBaseline='alphabetic';
        function fit(txt,font,size,max){g.font=font.replace('#',size);while(g.measureText(txt).width>max&&size>14){size-=2;g.font=font.replace('#',size);}return size;}
        function track(txt,sp){return txt.split('').join(String.fromCharCode(8202).repeat(sp));}
        g.fillStyle=C.acc==='#ff4c0f'?'#89fbcb':'#ff4c0f';fit('x','800 #px Almarai',26,9999);g.fillText(track('THE SKY PIRATES OF IMPERIA',2),W/2,170);
        g.fillStyle='#fffffe';fit('Crew Papers','#px "Atomic Marker"',112,W-220);g.fillText('Crew Papers',W/2,300);
        g.fillStyle='#f3ead9';g.font='400 30px Almarai';g.fillText('Seven legs, all survived.',W/2,365);
        g.strokeStyle='rgba(243,234,217,.5)';g.lineWidth=1;g.beginPath();g.moveTo(W/2-200,410);g.lineTo(W/2-20,410);g.moveTo(W/2+20,410);g.lineTo(W/2+200,410);g.stroke();
        g.save();g.translate(W/2,410);g.rotate(Math.PI/4);g.fillStyle=C.acc;g.fillRect(-7,-7,14,14);g.restore();
        g.fillStyle='#89fbcb';g.font='800 24px Almarai';g.fillText(track('CALL SIGN',2),W/2,490);
        g.fillStyle=C.acc;fit(C.call,'#px "Atomic Marker"',96,W-240);g.fillText(C.call,W/2,590);
        var rows=[['SHIP',C.ship],['RANK',C.rank],['DECK',C.deck],['WATCH',C.watch],['SKY COLOR',C.sky],['HOME PORT',C.port]];
        var colX=[W/2-215,W/2+215],y0=690,rowH=165;
        for(var i=0;i<rows.length;i++){var x=colX[i%2],y=y0+Math.floor(i/2)*rowH;
          g.strokeStyle='rgba(243,234,217,.3)';g.lineWidth=2;g.strokeRect(x-195,y-50,390,140);
          g.fillStyle='#89fbcb';g.font='800 20px Almarai';g.fillText(track(rows[i][0],2),x,y);
          g.fillStyle='#fffffe';fit(rows[i][1],'#px "Atomic Marker"',44,350);g.fillText(rows[i][1],x,y+62);
          if(rows[i][0]==='SKY COLOR'){g.fillStyle=C.acc;g.fillRect(x-150,y+78,300,5);}}
        g.fillStyle='#f3ead9';g.font='700 26px Almarai';g.fillText('Sky Run  |  mauriceafrich.com',W/2,H-118);
      }
      draw(r[1]);
      function out(){cv.toBlob(function(b){
        if(btn){btn.disabled=false;btn.textContent='Save My Papers';}
        if(!b)return;var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='sky-run-crew-papers.png';document.body.appendChild(a);a.click();
        setTimeout(function(){URL.revokeObjectURL(u);if(a.parentNode)a.parentNode.removeChild(a);},1500);},'image/png');}
      try{out();}catch(e){draw(false);out();}
    });
  }

  // ---------- MOVES ----------
  function die(id){var now=Date.now();memDead=now;lsSet(LOCK_KEY,String(now));lsSet(LAST_KEY,id);run=null;ssDel(RUN_KEY);viewDeath(id);}
  function finish(){lsSet(PAPERS_KEY,String(Date.now()));lsSet(PAPERS_KEY+'-xp',String(run&&run.xp?run.xp.length:0));ssDel(RUN_KEY);viewPapers();}
  function choose(i){
    var sc=S[run.s],c=sc&&sc.c[i];if(!c)return;
    if(c.need&&!run.f[c.need])return;
    var nx=resolve(c.go,run.f);
    if(D[nx]){die(nx);return;}
    if(c.set)run.f[c.set]=1;
    run.r=c.r||'';
    if(nx==='loot'){run.s='loot';save();viewLoot();return;}
    if(nx==='papers'){finish();return;}
    run.s=nx;
    if(c.xp){if(run.xp.indexOf(X[c.xp].code)<0)run.xp.push(X[c.xp].code);save();viewXp(c.xp);return;}
    viewStage();
  }
  function locked(){var last=lsGet(LAST_KEY);viewDeath(D[last]?last:'d_locked');}

  root.addEventListener('click',function(e){
    var t=e.target.closest('button,[data-act="skip"]');if(!t||busy)return;
    var a=t.getAttribute('data-act');
    if(a==='skip'){inner.classList.add('sr-skip');return;}
    if(t.hasAttribute('data-i')){if(lockLeft()>0){locked();return;}choose(parseInt(t.getAttribute('data-i'),10));return;}
    if(a==='board'){if(lockLeft()>0){locked();return;}run=newRun();viewStage();}
    else if(a==='cont'){viewStage();}
    else if(a==='over'){if(lockLeft()>0){locked();return;}viewAssign();}
    else if(a==='again'){if(lockLeft()>0)return;lsDel(LOCK_KEY);memDead=0;viewAssign();}
    else if(a==='aboard'){finish();}
    else if(a==='png'){savePng(t);}
    else if(a==='loot'){
      var k='U1hNVEJZMkM9Yz90b29sL21vYy5oY2lyZmFlY2lydWFtLnd3dy8vOnNwdHRo';
      if(/africhmaurice.github.io/.test(location.host)){alert('Preview: this is where loot box 42 opens.');return;}
      location.href=atob(k).split('').reverse().join('');
    }
  });

  // ---------- BOOT ----------
  if(lockLeft()>0){locked();}
  else{
    if(deadAt())lsDel(LOCK_KEY);
    var saved=null;try{saved=JSON.parse(ssGet(RUN_KEY)||'null');}catch(e){}
    if(saved&&saved.f&&saved.xp&&(S[saved.s]||saved.s==='loot')){run=saved;if(run.s==='loot')viewLoot();else viewStage();}
    else if(lsGet(PAPERS_KEY)){run=null;viewPapers();}
    else viewAssign();
  }
})();
</script>
