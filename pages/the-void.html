<!-- ============================================================
     THE VOID - clue #18. One tiny dot somewhere on a 1,000 x 1,000 pixel page.
     Clicking it opens loot box 18. The dot is 1px; its click area is a few pixels
     wider (still invisible) so it can be tapped on a phone at all.
     ============================================================ -->
<style>
html,body{margin:0 !important;padding:0 !important;background:#0b170f !important}
#ma-void{position:relative;width:1000px;height:1000px;background:#0b170f}
#ma-void .v-say{position:fixed;left:24px;top:22px;font-family:'Almarai',sans-serif;font-weight:800;font-size:20px;letter-spacing:.1em;color:#89fbcb;pointer-events:none;z-index:2}
#ma-void .v-dot{position:absolute;left:731px;top:618px;width:1px;height:1px;background:#213226;cursor:pointer}
#ma-void .v-dot::after{content:'';position:absolute;left:-3px;top:-3px;width:7px;height:7px}
</style>
<div id="ma-void" aria-label="The void"><div class="v-say">click the pixel</div><div class="v-dot" role="link" tabindex="-1"></div></div>
<script>
(function(){
  // The Squarespace section and its layout grid would clip a page this size: let it spill out.
  var v=document.getElementById('ma-void');
  for(var e=v.parentElement;e&&e!==document.body;e=e.parentElement){e.style.overflow='visible';e.style.maxWidth='none';if(e.classList.contains('fluid-engine'))e.style.display='block';if(e.classList.contains('content-wrapper')){e.style.padding='0';}}
  // Line the void up with the window's left edge, wherever Squarespace put the block.
  function edge(){v.style.marginLeft='0px';v.style.marginLeft=(-(v.getBoundingClientRect().left+window.scrollX))+'px';}
  edge();window.addEventListener('resize',edge);window.addEventListener('load',edge);
  var k='NkRTWTRYSks9Yz90b29sL21vYy5oY2lyZmFlY2lydWFtLnd3dy8vOnNwdHRo';
  v.querySelector('.v-dot').addEventListener('click',function(){location.href=atob(k).split('').reverse().join('');});
})();
</script>
