<!-- ============================================================
     KEEN EYE - hidden page for loot box 147 ("Keen Eye Loot Box", clue "Spot the Differences", hidden as an Act Three riddle).
     Lives at /keen-eye. Maurice: "Two pictures of the Crew. Find ten differences." / "they should be able to zoom in and
     then type their answers in."
     Two pictures side by side (stacked on phone). Players ZOOM to inspect: scroll wheel, a pinch, or the + and - buttons
     (1x to 5x), drag to pan, Reset to go back. Both pictures zoom and pan together, so the same spot shows in each.
     Tapping the pictures finds nothing. Players TYPE what changed and press Check.
     A right answer circles that spot in both pictures and adds a short label to the Spotted list. An answer that hits two
     unfound differences at once is turned away ("one at a time"), so listing everything does not work. After 3 misses in a
     row the Check button rests for 10 seconds. Find all ten and loot box 147 drops in; clicking it opens the claim link
     in a new tab.

     THE PICTURES: Maurice's own pair of the crew lineup (originals "What are the Differences 1.jpg" and "... 2.jpg",
     3600 x 2250). Web copies at full 3600 x 2250, webp q90 (10/28, sharper zoom): assets/games/147-left-hd.webp (original) and 147-right-hd.webp (his ten changes).
     The ten SPOTS were measured by diffing the two originals pixel by pixel. x and y are the center as fractions of the
     picture's width and height (0 = left/top, 1 = right/bottom); r is the circle radius as a fraction of the width.

     THE ANSWERS are NOT in this page in plain text (this comment ships with the page, so it does not name the ten
     differences either). Each difference has a few keyword sets; a set matches when the answer has a word from every
     group in it. The words are salted SHA-256 hashes, and each found-list label stays locked until a right answer unlocks it.
     The plain list of the ten differences, their keyword sets, and the builder live OFFLINE ONLY in
     site-batch2/_batch2/box150/tests/keen-eye-2/answers.mjs and build-keys.mjs (node build-keys.mjs rewrites the SPOTS
     block below). Answers are matched word by word after: lowercase, apostrophes dropped, other punctuation to spaces,
     simple plural strip, and small words (the, a, on, of ...) skipped.

     WORDS (approved by Maurice 10/27):
       heading "Keen Eye"; line "Ten things changed between these two pictures. Zoom in, spot them, then fill in the crew member's name and what changed."; blanks "Name" (placeholder "Which crew member?") and "What changed?" (placeholder "What is different?"); reply "Fill in the name too." (10/27: no names on the pictures);
       zoom help "Scroll, pinch, or use + and - to zoom. Drag to look around. Both pictures move together.";
       buttons "Zoom in", "Zoom out", "Reset", "Check", "Restart"; answer label "What changed?";
        counter "Found"; list heading "Spotted";
       replies "Yes! You spotted it.", "You already found that one.", "Not quite. Try again.",
       "One difference at a time, please.", "Keep it short: just the one difference.",
       "Take a closer look. You can check again in 10 seconds.", "Ready when you are.";
       win line "All ten spotted. Box 147 is yours.".
     ============================================================ -->

  var STOP={the:1,a:1,an:1,on:1,of:1,in:1,is:1,to:1,at:1,and:1,or:1,from:1,with:1,his:1,her:1,their:1,its:1,it:1,was:1,now:1,that:1,this:1,by:1,for:1,has:1,have:1,are:1,be:1,they:1,there:1};
  function stem(w){
    if(w.length>4&&/ies$/.test(w))return w.slice(0,-3)+'y';
    if(w.length>4&&/(ss|x|z|ch|sh)es$/.test(w))return w.slice(0,-2);
    if(w.length>3&&/s$/.test(w)&&!/(ss|us|is)$/.test(w))return w.slice(0,-1);
    return w;}
  function words(t){var seen={},out=[];String(t||'').toLowerCase().replace(/['‘’`]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').forEach(function(w){
    if(!w||STOP[w])return;w=stem(w);if(!seen[w]){seen[w]=1;out.push(w);}});return out;}
  var enc=new TextEncoder();
  function sha(s){return crypto.subtle.digest('SHA-256',enc.encode(s)).then(function(b){return new Uint8Array(b);});}
  function hex(u){var o='';for(var j=0;j<u.length;j++)o+=('0'+u[j].toString(16)).slice(-2);return o;}
  function unhex(h){var u=new Uint8Array(h.length/2);for(var j=0;j<u.length;j++)u[j]=parseInt(h.substr(j*2,2),16);return u;}
  /* For difference i: the first keyword set the words satisfy, and which word met each of its groups. */
  function match(i,ws){
    return Promise.all(ws.map(function(w){return sha('ke147:'+i+':'+w).then(function(h){return hex(h).slice(0,16);});})).then(function(hs){
      var sets=DATA.spots[i].s;
      for(var s=0;s<sets.length;s++){var pick=[],okAll=true;
        for(var g=0;g<sets[s].length&&okAll;g++){var hit=null;
          for(var k=0;k<sets[s][g].length&&!hit;k++){var at=hs.indexOf(sets[s][g][k][0]);if(at>=0)hit={w:ws[at],e:sets[s][g][k][1]};}
          if(hit)pick.push(hit);else okAll=false;}
        if(okAll)return {s:s,pick:pick};}
      return null;});
  }
  /* Unlock the label with the words that matched. */
  function label(i,m){
    return Promise.all(m.pick.map(function(p,g){return sha('ke147k:'+i+':'+m.s+':'+g+':'+p.w);})).then(function(ks){
      var key=new Uint8Array(16);m.pick.forEach(function(p,g){var e=unhex(p.e);for(var j=0;j<16;j++)key[j]^=e[j]^ks[g][j];});
      return sha('ke147l:'+hex(key)).then(function(ls){var b=atob(DATA.spots[i].l),o='';for(var j=0;j<b.length;j++)o+=String.fromCharCode(b.charCodeAt(j)^ls[j]);return o;});});
  }

  var found=[],misses=0,busy=false,coolT=null;
  function show(){nEl.textContent=found.length+'/'+TOTAL;}
  function tell(cls,txt){say.className='ke-say '+cls;say.textContent=txt;}
  function ring(i){
    var s=DATA.spots[i];
    Array.prototype.forEach.call(stages,function(st){
      var m=document.createElement('span');m.className='ke-ring';m.setAttribute('data-spot',i);
      m.style.left=(s.x*100)+'%';m.style.top=(s.y*100)+'%';m.style.width=(s.r*200)+'%';
      st.querySelector('.ke-marks').appendChild(m);
    });
  }
  function cooldown(){var left=10;go.disabled=true;
    function tick(){if(left<=0){clearInterval(coolT);coolT=null;go.disabled=false;go.textContent='Check';misses=0;tell('info','Ready when you are.');return;}
      go.textContent='Wait '+left;left--;}
    tell('wrong','Take a closer look. You can check again in 10 seconds.');tick();coolT=setInterval(tick,1000);}
  function miss(txt){misses++;if(misses>=3)cooldown();else tell('wrong',txt);}
  form.addEventListener('submit',function(e){e.preventDefault();
    if(busy||go.disabled||found.length>=TOTAL)return;
    var nm=words(nameIn.value),ws=words(inp.value);if(!nm.length){tell('info','Fill in the name too.');nameIn.focus();return;}if(!ws.length){inp.focus();return;}
    if(ws.length>8||nm.length>2){tell('info','Keep it short: just the one difference.');return;}
    ws=nm.concat(ws);
    busy=true;
    var all=[];for(var i=0;i<TOTAL;i++)all.push(match(i,ws));
    Promise.all(all).then(function(r){
      var fresh=[],old=0;r.forEach(function(m,i){if(!m)return;if(found.indexOf(i)>=0)old++;else fresh.push(i);});
      if(fresh.length>1){busy=false;miss('One difference at a time, please.');return;}
      if(!fresh.length){busy=false;if(old)tell('info','You already found that one.');else miss('Not quite. Try again.');return;}
      var i=fresh[0];return label(i,r[i]).then(function(t){busy=false;misses=0;
        found.push(i);ring(i);show();
        var li=document.createElement('li');li.textContent=t;list.appendChild(li);
        tell('right','Yes! You spotted it.');inp.value='';nameIn.value='';
        if(found.length===TOTAL){inp.disabled=true;nameIn.disabled=true;go.disabled=true;setTimeout(function(){win.hidden=false;win.scrollIntoView({behavior:'smooth',block:'center'});},450);}
      });
    }).catch(function(){busy=false;tell('wrong','Something went wrong. Try again.');});
  });

  function restart(){found=[];misses=0;busy=false;if(coolT){clearInterval(coolT);coolT=null;}go.disabled=false;go.textContent='Check';inp.disabled=false;nameIn.disabled=false;nameIn.value='';inp.value='';
    tell('info','');win.hidden=true;list.innerHTML='';Array.prototype.forEach.call(stages,function(s){s.querySelector('.ke-marks').innerHTML='';});Z={z:1,x:0,y:0};paint();show();}
  d.querySelector('.ke-restart').addEventListener('click',restart);
  d.querySelector('.ke-box').addEventListener('click',claim);
  show();paint();
})();
</script>
