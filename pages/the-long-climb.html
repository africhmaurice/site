<!-- ============================================================
     THE LONG CLIMB - hidden page for loot box 86. Lives at /the-long-climb-53353 (hidden from search; Maurice 10/15). (Was The Long Fall; Maurice 10/15: "make it THE LONG CLIMB instead,
     a platform jumping game that goes UP. You have to get to the top! And it goes from day to night").
     The game fills the window. You start on the ground and jump from floating island to floating island, 24,000 units
     up (about 200 islands, the same for everyone). Islands are one-way: you jump up through them and land on top.
     Missing a jump just drops you to a lower island. From a third of the way up, some islands drift side to side.
     The sky goes from bright day through sunset to night as you climb (stars and the moon come out near the top).
     At the very top: loot box 86 on the last island. Walk into it and the box shows; clicking it opens the claim link.
     Controls: arrows or A / D to move; Space, Up, or W to jump (hold for a higher jump). Phones: Left, Jump, Right buttons.
     No progress bar. The title and controls line show at the start and fade once you begin climbing.
     Art: the climber is Little Izzy (86-izzy.png, Maurice 10/16). Island, ground, cloud, sun, and moon are his 86-*.png (10/16). Not his yet: the stars, clouds, sun, and moon are drawn in code until Maurice draws them.
     DRAFT copy (mine): the controls lines and "The top!".
     PAUSE (Maurice 10/19): a "Pause" button in the top-right corner (or P, or Escape, or hiding the tab) freezes Izzy,
     the drifting islands, the twinkling stars, and the climb's day-to-night sky, blocks the controls, and shows "Paused"
     with Resume; Resume carries on with no time jump. There is no save (Maurice 10/19); a leftover
     ma-save-the-long-climb from testing is deleted on load.
     DRAFT copy (10/19): "Pause", "Paused", "Resume".
     LOOT BOX 137, Halfway Up the Long Climb (clue: "About halfway up"): a small secret island floats off the LEFT edge of the
     climb in the sunset part of the sky, a little above the "ledge": the fixed island that sits closest to the left edge
     between 50% and 62% of the way up (today island 126, 58% up, the red sunset sky; same for everyone). Normally the
     climber can't leave the 600-unit column; standing on the ledge, or jumping off it, the left edge opens: a running
     jump left off the ledge lands on the secret island (one jump; it's about 90 units across and 50 up). Anywhere else
     (or falling from the ledge) a breeze pushes you back into the column. While you're on or near the ledge the view
     slides left so the island shows on phones too. The island has his box 137 art on it; walking into the box pauses the
     climb and shows it (claim link in a new tab); Keep climbing carries on. The island drawing is his 86-island.png.
     DRAFT copy: "A hidden island!", "Keep climbing".
