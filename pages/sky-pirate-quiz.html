<section id="ma-quiz" aria-label="Sky pirate job quiz">
  <header class="q-head">
    <p class="q-eyebrow">All hands on deck</p>
    <h1 class="q-h1">What Sky Pirate Job Are You Most Like?</h1>
    <p class="q-sub">Every airship needs a crew. Answer nine questions and I'll tell you where you'd sign on.</p>
  </header>
  <div class="q-card">
    <div class="q-play">
      <div class="q-meta"><span class="q-count">Question 1 of 9</span><span class="q-pct">0%</span></div>
      <div class="q-bar" role="progressbar" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0"><div class="q-fill"></div></div>
      <h2 class="q-text" aria-live="polite"></h2>
      <div class="q-opts"></div>
    </div>
    <div class="q-result" aria-live="polite">
      <p class="r-eye">You are most like the</p>
      <h2 class="r-job"></h2>
      <p class="r-tag"></p>
      <p class="r-desc"></p>
      <p class="r-share">Screenshot this and tag @mauriceafrich with your result.</p>
      <button class="r-again" type="button">Take it again</button>
    </div>
  </div>
</section>
<script>
(function(){
  var root=document.getElementById('ma-quiz');if(!root)return;
  // Fill the whole window: no Squarespace padding around it.
  var cw=root.closest('.content-wrapper');if(cw){cw.style.padding='0';cw.style.maxWidth='none';}
  var fe=root.closest('.fluid-engine');if(fe)fe.style.display='block';

  var JOBS={
    captain:{t:'Captain',c:'#ff4c0f',tag:'The deck answers to you.',d:'You make the call when the sky turns ugly, and somehow the crew follows you into it. You are calm, a little reckless, and you never leave anyone behind on the dock.'},
    pilot:{t:'Pilot',c:'#89fbcb',tag:'Hands on the wheel, eyes on the clouds.',d:'You feel the wind before it hits. Tight gaps, sudden drops, and storms are just a good day at work. The crew holds on and trusts you to bring the ship home in one piece.'},
    gunner:{t:'Gunner',c:'#ff4c0f',tag:'Loud, loyal, and very hard to argue with.',d:'When trouble shows up off the bow, you are already loading. You protect your people first and ask questions later, and nobody sleeps better than the crew with you on watch.'},
    runner:{t:'Runner',c:'#a2f590',tag:'Fast feet, faster mouth.',d:'You carry the messages, the deals, and the gossip from one end of the ship to the other, and from port to port. If something needs doing yesterday, you are the one already halfway there.'},
    techtailor:{t:'Techtailor',c:'#c3a6ff',tag:'Needle in one hand, wrench in the other.',d:'You stitch sails, patch engines, and make gear nobody else could dream up from scraps. When something breaks, the crew yells your name, and you are already rolling up your sleeves.'},
    quartermaster:{t:'Quartermaster',c:'#f3ead9',tag:'Every coin counted, every barrel stacked.',d:'You keep the crew fed, paid, and honest. You know exactly what is in the hold, who owes what, and how to split the loot so nobody starts a mutiny over it.'},
    navigator:{t:'Navigator',c:'#89fbcb',tag:'Maps, stars, and a hunch.',d:'You read the sky like a book and always know which way home is. Where everyone else sees endless clouds, you see a route, a shortcut, and a secret island nobody has charted yet.'},
    lookout:{t:'Lookout',c:'#a2f590',tag:'Nothing gets past you.',d:'Up in the crow\'s nest, you spot the storm, the rival ship, and the shiny thing on the horizon long before anyone else. You notice the small stuff, and that is exactly why the crew is still alive.'}
  };
  var ORDER=['captain','pilot','gunner','runner','techtailor','quartermaster','navigator','lookout'];
  var BOX_Q=5,BOX_A=2; // question 6, answer C
  var QS=[
    {q:'A rival airship pulls up alongside. What do you do?',a:[['Hail them and do the talking','captain'],['Swing us hard into the clouds','pilot'],['Roll out the cannons','gunner'],['Count their crew and their cargo','lookout quartermaster']]},
    {q:'Pick your spot on the ship.',a:[['The wheel, obviously','pilot'],['The crow\'s nest, way up top','lookout'],['The workshop below deck','techtailor'],['The chart table by the lanterns','navigator']]},
    {q:'Shore leave in a new port. Where are you headed?',a:[['The market, to haggle for supplies','quartermaster'],['Everywhere at once, I have errands','runner'],['The map shop with the dusty back room','navigator'],['The tavern, to hear who is hiring','captain']]},
    {q:'What is in your pockets right now?',a:[['A compass and a half-drawn map','navigator'],['Spare bolts, thread, and a tiny screwdriver','techtailor'],['A spyglass and a snack','lookout'],['A sealed letter I am not supposed to read','runner']]},
    {q:'The crew is arguing over the loot. You...',a:[['Split it fair and write it down','quartermaster'],['Settle it with one look','captain'],['Hide the best piece until they calm down','runner'],['Fire one warning shot into the sky','gunner']]},
    {q:'Something just broke and the ship is shaking. Your move?',a:[['Hold her steady with both hands','pilot'],['Find the safest route down','navigator'],['Patch it with whatever is lying around','techtailor'],['Shout orders until everyone moves','captain']]},
    {q:'Pick a sky pirate snack.',a:[['Hardtack, rationed carefully','quartermaster'],['Whatever I can eat while running','runner'],['Spicy jerky, extra spicy','gunner'],['Cloudberry pie, saved for later','lookout']]},
    {q:'A storm is coming. What is your first thought?',a:[['I saw it an hour ago','lookout'],['I know a way around it','navigator'],['Let\'s fly right through it','pilot gunner'],['Are the sails stitched tight?','techtailor']]},
    {q:'Your crew would describe you as...',a:[['The one in charge','captain'],['The one who fixes everything','techtailor'],['The one who never runs out of anything','quartermaster'],['The one you can never catch','runner gunner']]}
  ];
  var N=QS.length,i=0,score={};
  var $=function(s){return root.querySelector(s);};
  var txt=$('.q-text'),opts=$('.q-opts'),fill=$('.q-fill'),bar=$('.q-bar'),cnt=$('.q-count'),pct=$('.q-pct');
  var k='UUFYRVlGNUM9Yz90b29sL21vYy5oY2lyZmFlY2lydWFtLnd3dy8vOnNwdHRo';
  function openBox(e){e.preventDefault();e.stopPropagation();
    if(/africhmaurice.github.io/.test(location.host)){alert('Preview: this is where loot box 40 opens.');return;}
    location.href=atob(k).split('').reverse().join('');}
  function setBar(n){var p=Math.round(n/N*100);fill.style.width=p+'%';pct.textContent=p+'%';bar.setAttribute('aria-valuenow',n);}
  function show(){
    var Q=QS[i];cnt.textContent='Question '+(i+1)+' of '+N;setBar(i);txt.textContent=Q.q;opts.innerHTML='';
    Q.a.forEach(function(a,j){
      var w=document.createElement('div');w.className='q-opt';
      var b=document.createElement('button');b.type='button';b.className='q-ans';
      var l=document.createElement('span');l.className='q-l';l.textContent='ABCD'.charAt(j);
      var s=document.createElement('span');s.textContent=a[0];b.appendChild(l);b.appendChild(s);
      b.addEventListener('click',function(){a[1].split(' ').forEach(function(x){score[x]=(score[x]||0)+1;});i++;if(i<N)show();else finish();});
      w.appendChild(b);
      if(i===BOX_Q&&j===BOX_A){w.className+=' has-box';
        var x=document.createElement('button');x.type='button';x.className='q-box';x.setAttribute('aria-label','Loot box 40');
        x.innerHTML='<img src="https://africhmaurice.github.io/leaderboard/loot/40.png" alt="Loot box 40">';
        x.addEventListener('click',openBox);w.appendChild(x);}
      opts.appendChild(w);
    });
  }
  function finish(){
    setBar(N);var best=ORDER[0];ORDER.forEach(function(j){if((score[j]||0)>(score[best]||0))best=j;});
    var J=JOBS[best];var rj=$('.r-job');rj.textContent=J.t;rj.style.color=J.c;
    $('.r-tag').textContent=J.tag;$('.r-desc').textContent=J.d;
    root.classList.add('done');root.scrollIntoView({behavior:'smooth',block:'start'});
  }
  $('.r-again').addEventListener('click',function(){i=0;score={};root.classList.remove('done');show();root.scrollIntoView({behavior:'smooth',block:'start'});});
  show();
})();
</script>
