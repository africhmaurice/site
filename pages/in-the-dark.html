<style>
html,body{margin:0 !important;padding:0 !important;background:#060d08 !important}
#ma-dark{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:60px 20px;box-sizing:border-box;

#ma-dark .d-stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fffffe;opacity:.7;animation:d-tw 3.5s ease-in-out infinite}

#ma-dark .d-day{font-weight:700;font-size:15px;letter-spacing:.18em;color:rgba(255,255,254,.28)}
#ma-dark .d-box{display:none;width:min(62vw,360px);cursor:default;filter:drop-shadow(0 0 40px rgba(255,76,15,.35));animation:d-bob 4s ease-in-out infinite;border:0;background:none;padding:0}

#ma-dark .d-say{display:none;font-family:'Atomic Marker',cursive;font-size:clamp(28px,4vw,44px);color:#fd7547}
#ma-dark.night .d-box,#ma-dark.night .d-say{display:block}
#ma-dark.night .d-day{display:none}
@keyframes d-bob{50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){#ma-dark .d-box,#ma-dark .d-stars i{animation:none}}
</style>
