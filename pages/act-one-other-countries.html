<!-- ============================================================
     ACT ONE OTHER COUNTRIES - replays Maurice's recorded Act One draws. Each wheel lives on GitHub Pages
     (treasure-hunt-leaderboard/public/wheels/, built from the saved draw) and only ever replays it:
     every click of Spin shows the next of his five spins, the same layout and the same landing.
     Act One is violet (Maurice, 2026-10-01).
     ============================================================ -->
<style>
#ma-w1{width:100vw;position:relative;left:50%;margin-left:-50vw;background:#2d1c53;font-family:'Almarai',sans-serif;color:#fffffe;box-sizing:border-box;padding:48px 16px 64px}
#ma-w1 *{box-sizing:border-box;border-radius:0}
#ma-w1 .w-head{max-width:1100px;margin:0 auto;display:grid;gap:14px;text-align:center}
#ma-w1 .w-eyebrow{margin:0;font-weight:800;font-size:13px;line-height:1.3;letter-spacing:.2em;text-transform:uppercase;color:#a2f590}
#ma-w1 .w-title{margin:0;font-family:'Atomic Marker',cursive;font-weight:400;font-size:clamp(38px,6vw,72px);line-height:1.2;letter-spacing:.03em;color:#fffffe}
#ma-w1 .w-lede{margin:0 auto;max-width:62ch;font-size:17px;line-height:1.55;color:#f3ead9}
#ma-w1 .w-tabs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:28px auto 20px}
#ma-w1 .w-tabs button{font-family:'Almarai',sans-serif;font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#fffffe;background:#482d85;border:2px solid #f3ead9;box-shadow:4px 5px 0 rgba(0,0,0,.35);padding:14px 28px;cursor:pointer;transition:transform .15s ease,background .15s ease}
#ma-w1 .w-tabs button:hover{transform:scale(1.04)}
#ma-w1 .w-tabs button[aria-selected="true"]{background:#fffffe;color:#2d1c53}
#ma-w1 .w-frame{max-width:1400px;margin:28px auto 0;border:2px solid #f3ead9;box-shadow:6px 7px 0 rgba(0,0,0,.4);background:#0b170f}
#ma-w1 iframe{display:block;width:100%;height:860px;border:0;background:#0b170f}
#ma-w1 .w-rewards{max-width:900px;margin:28px auto 0;text-align:center;font-family:'Atomic Marker',cursive;font-weight:400;font-size:clamp(24px,3.4vw,38px);line-height:1.2;letter-spacing:.03em;color:#a2f590}
#ma-w1 .w-note{max-width:900px;margin:22px auto 0;text-align:center;font-size:14px;line-height:1.55;color:#c3a6ff}
#ma-w1 .w-note a{color:#fffffe}
@media (max-width:560px){#ma-w1{padding:36px 16px 48px}#ma-w1 .w-tabs button{flex:1 1 100%}}
</style>
<div id="ma-w1">
  <div class="w-head">
    <p class="w-eyebrow">The Cello’s Gate Treasure Hunt</p>
    <h1 class="w-title">Other Countries</h1>
    <p class="w-lede">Every Act One entry from outside the U.S. and the UK got its own slice of the wheel. Press Spin to watch each draw exactly as it happened, one winner at a time.</p>
  </div>
  <div class="w-frame"><iframe id="ma-w1-frame" title="Other Countries draw" src="https://africhmaurice.github.io/leaderboard/wheels/act-one-world.html"></iframe></div>
  <p class="w-rewards">For “Fun.”</p>
</div>
<script>
(function () {
  var root = document.getElementById('ma-w1'), f = document.getElementById('ma-w1-frame');
  // The Squarespace section around the block takes the page's violet, so no red shows above or below.
  var sec = root.closest('section');
  if (sec) { sec.style.setProperty('background', '#2d1c53', 'important'); var bg = sec.querySelector('.section-background'); if (bg) bg.style.setProperty('background', '#2d1c53', 'important'); }
  f.src = 'https://africhmaurice.github.io/leaderboard/wheels/act-one-world.html?v=1';
  // On phones the wheel stacks above the winners, so it reports its full height.
  window.addEventListener('message', function (e) {
    if (e.source === f.contentWindow && e.data && e.data.wheelHeight && innerWidth <= 820) f.style.height = e.data.wheelHeight + 'px';
  });
})();
</script>
