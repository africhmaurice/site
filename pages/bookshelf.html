<!-- THE BOOKSHELF (mauriceafrich.com/bookshelf). Maurice 11/6: top 10 of all time, then the five books most recently rated 5 stars,
     newest first. Five per row, full page, two per row on phones: number, cover, white outline, hard drop shadow, nothing else.
     Maurice 11/7: red overlay, every cover links to its Amazon page, "Maurice's" above Bookshelf, BOOKSHELF in every menu. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cracked Imperia';src:url('https://africhmaurice.github.io/site/assets/fonts/CrackedImperia-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
#ma-shelf{font-family:'Almarai',sans-serif;letter-spacing:0;color:#fffffe;position:relative;width:100vw;margin-left:calc(50% - 50vw);overflow-x:hidden;
  background:linear-gradient(178deg,rgba(145,37,1,.95) 0%,rgba(197,50,0,.94) 50%,rgba(145,37,1,.96) 100%),url(https://africhmaurice.github.io/site/assets/bg/neon-street-as1928158052.webp) center/cover;background-color:#912501;background-attachment:fixed}
section:has(#ma-shelf) .content-wrapper{padding:0!important;max-width:none!important}
#ma-shelf *{box-sizing:border-box}
#ma-shelf .bs-wrap{padding:clamp(44px,5vw,80px) clamp(20px,3.4vw,64px) clamp(64px,7vw,110px);display:flex;flex-direction:column;gap:clamp(56px,6vw,96px)}
#ma-shelf h1,#ma-shelf h2,#ma-shelf .bs-num,#ma-shelf .bs-owner{font-family:'Cracked Imperia',Impact,sans-serif;font-weight:700;text-transform:uppercase;line-height:1.05;letter-spacing:.03em;color:#fffffe;text-align:center;margin:0}
#ma-shelf .bs-title{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,22px)}
#ma-shelf .bs-owner{font-size:clamp(34px,4.6vw,72px)}
#ma-shelf h1{font-size:clamp(60px,10vw,150px)}
#ma-shelf h2{font-size:clamp(34px,4.6vw,72px);text-wrap:balance}
#ma-shelf .bs-sec{display:flex;flex-direction:column;gap:clamp(28px,3.2vw,48px)}
#ma-shelf .bs-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:clamp(22px,2.8vw,52px);row-gap:clamp(36px,3.8vw,64px)}
#ma-shelf .bs-book{display:flex;flex-direction:column;gap:clamp(12px,1.2vw,18px);margin:0;padding:0}
#ma-shelf .bs-num{font-size:clamp(30px,3.6vw,60px)}
#ma-shelf .bs-book a{display:block}
#ma-shelf .bs-book a:focus-visible{outline:3px solid #fff;outline-offset:6px}
#ma-shelf .bs-book img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;border:5px solid #fff;border-radius:0;box-shadow:clamp(6px,.7vw,12px) clamp(7px,.84vw,14px) 0 #0b170f}
@media (max-width:600px){
  #ma-shelf .bs-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:32px}
  #ma-shelf .bs-num{font-size:30px}
  #ma-shelf .bs-book img{border-width:4px;box-shadow:6px 7px 0 #0b170f}
}
</style>

      <li class="bs-book"><div class="bs-num">6</div><a href="https://www.amazon.com/dp/0425285944" target="_blank" rel="noopener"><img src="https://africhmaurice.github.io/site/assets/bookshelf/dark-age.jpg" width="900" height="1364" alt="Dark Age by Pierce Brown, cover, on Amazon" loading="lazy"></a></li>

      <li class="bs-book"><div class="bs-num">5</div><a href="https://www.amazon.com/dp/076532363X" target="_blank" rel="noopener"><img src="https://africhmaurice.github.io/site/assets/bookshelf/forge-of-darkness.jpg" width="250" height="329" alt="Forge of Darkness by Steven Erikson, cover, on Amazon" loading="lazy"></a></li>

  </div>
</div>
