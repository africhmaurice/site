<!-- THE BOOKSHELF (mauriceafrich.com/bookshelf). Maurice 11/6: top 10 of all time, then the ten books most recently rated 5 stars,
     newest first. Five per row, full page, two per row on phones: number, cover, white outline, hard drop shadow, nothing else.
     Maurice 11/8: five more recent reads (ten in all); 11/9: The Legend of Uh at 1, Absolute Flash out, the four 11/8 adds at 7-10, heading "10 Most Recent 5-Star Reads".
     Maurice 11/7: red overlay, every cover links to its Amazon page, "Maurice's" above Bookshelf, BOOKSHELF in every menu.
     Redesign (Maurice 2026-11-12, sandbox): today's look, a Links-style tile wall. Each book is a tile (a dark brand color at 90%
     over his art) with its rank as a big Cracked Imperia number and the cover under it; the whole tile links to Amazon in a new
     tab. Top 10: number 1 is a large tile, 2-5 fill the block beside it, 6-10 run in a row of five, so no row has a hole (on
     phones: 1 across, then two per row, 10 across). Recent reads: five per row, two on phones. The ember page and his
     covers stay. Edited in this built page directly. No new words. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cracked Imperia';src:url('https://africhmaurice.github.io/site/assets/fonts/CrackedImperia-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
#ma-shelf{font-family:'Almarai',sans-serif;letter-spacing:0;color:#fffffe;position:relative;width:100vw;margin-left:calc(50% - 50vw);overflow-x:hidden;
  background:linear-gradient(178deg,rgba(145,37,1,.95) 0%,rgba(197,50,0,.94) 50%,rgba(145,37,1,.96) 100%),url(https://africhmaurice.github.io/site/assets/bg/neon-street-as1928158052.webp) center/cover;background-color:#912501;background-attachment:fixed}
section:has(#ma-shelf) .content-wrapper{padding:0!important;max-width:none!important}
/* no strip above the page (Maurice 2026-11-12, round 2: "black line at the top of bookshelf, remove"): the site's top-gap rule
   padded this section by 8px and the ink section edge showed through; data-ma-keep-top keeps that rule off this page */
section:has(#ma-shelf){padding-top:0!important}
#ma-shelf *{box-sizing:border-box}
#ma-shelf .bs-wrap{padding:0 clamp(28px,6.4vw,128px) clamp(72px,7vw,120px);display:flex;flex-direction:column;gap:clamp(72px,7vw,120px)}
#ma-shelf h1,#ma-shelf h2,#ma-shelf .bs-num,#ma-shelf .bs-owner{font-family:'CI Face','Cracked Imperia',Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.05;letter-spacing:.03em;color:#fffffe;text-align:center;margin:0}
#ma-shelf .bs-title{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,1.6vw,26px)}
#ma-shelf .bs-owner{font-size:clamp(34px,4.6vw,72px)}
#ma-shelf h1{font-size:clamp(64px,13vw,200px)}
#ma-shelf h2{font-size:clamp(34px,4.6vw,72px);text-wrap:balance}
#ma-shelf .bs-sec{display:flex;flex-direction:column;gap:clamp(32px,3.6vw,56px)}
/* the first screen is the title and "My Top 10 Books of All Time" only; the tiles start below the fold (round 2) */
#ma-shelf .bs-hero{min-height:100vh;min-height:100lvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(48px,6vh,80px);padding:clamp(130px,16vh,170px) 0 clamp(40px,6vh,72px)}
/* the tile wall */
#ma-shelf .bs-grid{list-style:none;margin:0;padding:0;display:grid;gap:12px}
#ma-shelf .bs-top{grid-template-columns:repeat(20,minmax(0,1fr));grid-auto-rows:clamp(300px,27vw,420px)}
#ma-shelf .bs-top>li{grid-column:span 4}
#ma-shelf .bs-top>li:nth-child(n+2):nth-child(-n+5){grid-column:span 5}
#ma-shelf .bs-top>li:first-child{grid-column:span 10;grid-row:span 2}
#ma-shelf .bs-recent{grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:clamp(300px,27vw,420px)}
#ma-shelf .bs-book{display:flex;min-width:0;min-height:0;margin:0;padding:0}
#ma-shelf .bs-tile{position:relative;flex:1;display:flex;min-width:0;min-height:0;text-decoration:none;color:#fffffe;outline:none}
#ma-shelf .bs-tin{flex:1;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,1.2vw,18px);min-width:0;min-height:0;padding:clamp(20px,1.8vw,28px) 20px clamp(26px,2.2vw,34px);transition:transform .18s ease;
  background:linear-gradient(var(--tc),var(--tc)),var(--ta) center/cover}
/* four dark brand colors over his art, in turn */
#ma-shelf .bs-book:nth-child(4n+1) .bs-tin{--tc:rgba(11,23,15,.9);--ta:url(https://africhmaurice.github.io/site/assets/bg/m/city-skyline-panorama-as348070597.webp)}
#ma-shelf .bs-book:nth-child(4n+2) .bs-tin{--tc:rgba(26,94,65,.9);--ta:url(https://africhmaurice.github.io/site/assets/bg/m/crystal-towers-lake-as395045722.webp)}
#ma-shelf .bs-book:nth-child(4n+3) .bs-tin{--tc:rgba(45,28,83,.9);--ta:url(https://africhmaurice.github.io/site/assets/bg/m/floating-blocks-city-as311317794.webp)}
#ma-shelf .bs-book:nth-child(4n+4) .bs-tin{--tc:rgba(27,59,21,.9);--ta:url(https://africhmaurice.github.io/site/assets/bg/m/dome-city-mist-as159145789.webp)}
/* white edge on hover, a slight press tilt, and the cover grows 5% (Maurice 11/11) */
#ma-shelf .bs-tile::after{content:"";position:absolute;inset:0;border:2px solid transparent;pointer-events:none;transition:border-color .15s}
#ma-shelf .bs-tile:hover::after,#ma-shelf .bs-tile:focus-visible::after{border-color:#fffffe}
#ma-shelf .bs-tile:focus-visible::after{border-width:3px}
#ma-shelf .bs-tile:active .bs-tin{transform:perspective(800px) rotateX(4deg) scale(.985)}
#ma-shelf .bs-num{flex:none;font-size:clamp(40px,4.2vw,68px)}
#ma-shelf .bs-top>li:first-child .bs-num{font-size:clamp(72px,9vw,150px)}
#ma-shelf .bs-cv{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;container-type:size}
/* the cover takes its size from the tile, not from the file, so the wall holds its shape while covers load; 1.31 keeps the widest cover (about 0.76 wide to 1 tall) inside the tile */
#ma-shelf .bs-cv img{display:block;width:auto;height:min(calc(100cqh - 14px),calc((100cqw - 14px) * 1.31));max-width:calc(100% - 14px);max-height:calc(100% - 14px);border:5px solid #fff;border-radius:0;box-shadow:clamp(6px,.7vw,12px) clamp(7px,.84vw,14px) 0 #0b170f;transition:transform .18s ease}
@media (hover:hover){#ma-shelf .bs-tile:hover .bs-cv img{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){#ma-shelf .bs-tin,#ma-shelf .bs-cv img{transition:none}#ma-shelf .bs-tile:active .bs-tin{transform:none}}
@media (max-width:1000px){
  #ma-shelf .bs-top{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(280px,62vw,420px)}
  #ma-shelf .bs-top>li,#ma-shelf .bs-top>li:nth-child(n+2):nth-child(-n+5){grid-column:span 1}
  #ma-shelf .bs-top>li:first-child{grid-column:1/-1;grid-row:span 2}
  #ma-shelf .bs-top>li:last-child{grid-column:1/-1}
  #ma-shelf .bs-recent{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:clamp(280px,62vw,420px)}
}
@media (max-width:600px){
  #ma-shelf .bs-hero{padding-top:160px}
  #ma-shelf .bs-grid{gap:10px}
  #ma-shelf .bs-num{font-size:34px}
  #ma-shelf .bs-top>li:first-child .bs-num{font-size:64px}
  #ma-shelf .bs-tin{padding:18px 20px 24px;gap:12px}
  #ma-shelf .bs-cv img{border-width:4px;box-shadow:6px 7px 0 #0b170f;height:min(calc(100cqh - 8px),calc((100cqw - 8px) * 1.31));max-width:calc(100% - 8px);max-height:calc(100% - 8px)}
  /* two per row: each cover runs the full width of its tile (inside the padding) unless it is taller than about 1.5 to 1,
     then it fills the height instead (the browser keeps its shape); the wide tile (10) keeps the height rule above */
  #ma-shelf .bs-top,#ma-shelf .bs-recent{grid-auto-rows:calc((50vw - 33px - 48px) * 1.5 + 110px)}
  #ma-shelf .bs-book:not(.bs-top>li:last-child) .bs-cv img{width:auto;height:auto;max-width:calc(100cqw - 8px);max-height:calc(100cqh - 8px)}
}
</style>
