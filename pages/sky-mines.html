<!-- ============================================================
     SKY MINES - hidden page for loot box 144 (the Sky Mines Legendary Loot Box). Lives at /sky-mines.
     Minesweeper in the open sky. The board is a bank of clouds over a dusk sky; under some clouds float the mine-layer's
     sky mines (Sky Gauntlet art: assets/games/78-mine.png, and 78-mine-layer.png crosses the top as each field is laid).
     Ordinary minesweeper rules: tap a cloud to clear it; a number counts the mines touching that cell (all eight sides);
     flag the mines; tap a number whose mines are all flagged to clear the rest around it. The first tap is always safe.
     THE TWIST, the wind: every fourth clearing move, a gust drifts one hidden mine to the next cell in the wind's
     direction. The drifted mine is SPOTTED (shown on the board, it can't be tapped), its old cell is safe again, and the
     numbers update. The player always sees which mine moved and where, so the wind never adds guessing beyond ordinary
     minesweeper; it only reshapes the field.
     Board: 10 across, 12 down, 20 mines. Hit a mine and the field resets (Restart deals a new one).
     Clear every safe cell and the Legendary loot box 144 rises over the field; clicking it opens the claim link.
     Phones: Flag mode button, or long-press a cloud to flag. Desktop: right-click to flag.
     Test hook: ?test=1 exposes window.__skyMines.state() (mine positions) for the test harness.
     DRAFT (all words on this page are new, for Maurice to approve):
       heading "Sky Mines"; line "Clear the clouds and dodge the sky mines. Every fourth move, the wind drifts a mine.";
       counters "Mines", "Gust in"; buttons "Flag mode: off" / "Flag mode: on", "Restart";
       gust line "A gust drifts a mine [north / south / east / west]. Now you can see it.";
       lose line "Boom. The sky mine got you."; win line "Field cleared. The Legendary loot box is yours.";
       first line "Tap any cloud to start. The first one is always clear.".
     ============================================================ -->

<style>
@font-face{font-family:'Cracked Imperia';src:url('https://africhmaurice.github.io/site/assets/fonts/CrackedImperia-Bold.woff2') format('woff2');font-weight:100 900;font-display:block;size-adjust:109.5%}
#ma-skymines{width:100vw;position:relative;left:50%;margin-left:-50vw;box-sizing:border-box;min-height:100vh;overflow-x:hidden;
  padding:clamp(120px,14vh,160px) 20px 80px;background-color:#0b170f;background-image:linear-gradient(180deg,rgba(45,28,83,.84) 0%,rgba(72,45,133,.8) 42%,rgba(15,92,77,.84) 100%),url(https://africhmaurice.github.io/site/assets/bg/d/blue-sky-clouds-as606240509.webp);background-position:center;background-size:cover;background-repeat:no-repeat;background-attachment:scroll;
  color:#f3ead9;font-family:'Almarai',sans-serif;text-align:center}
#ma-skymines *{box-sizing:border-box;border-radius:0}
@media (max-width:900px){#ma-skymines{background-image:linear-gradient(180deg,rgba(45,28,83,.84) 0%,rgba(72,45,133,.8) 42%,rgba(15,92,77,.84) 100%),url(https://africhmaurice.github.io/site/assets/bg/m/blue-sky-clouds-as606240509.webp)}}
#ma-skymines [hidden]{display:none!important}
#ma-skymines .sm-cloud{position:absolute;pointer-events:none;opacity:.22;width:min(520px,70vw);height:auto;animation:smDrift 70s linear infinite}
#ma-skymines .sm-cloud.c2{animation-duration:95s;animation-delay:-40s;opacity:.16}
@keyframes smDrift{from{transform:translateX(-60vw)}to{transform:translateX(120vw)}}
#ma-skymines .sm-wrap{position:relative;max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:20px}
#ma-skymines h1{margin:0;font-family:'Cracked Imperia',Impact,sans-serif;font-weight:400;font-size:clamp(40px,6.4vw,70px);line-height:1.2;letter-spacing:.04em;text-transform:uppercase;color:#fffffe}
#ma-skymines .sm-lede{margin:0;font-weight:700;font-size:clamp(16px,1.8vw,19px);line-height:1.5;max-width:560px}
#ma-skymines .sm-bar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px 22px;font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
#ma-skymines .sm-bar b{color:#89fbcb;font-weight:800}
#ma-skymines .sm-btn{margin:0;padding:10px 16px;border:1px solid rgba(243,234,217,.5);background:rgba(11,23,15,.35);color:#f3ead9;font:800 13px/1.2 'Almarai',sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;touch-action:manipulation}
#ma-skymines .sm-btn:hover,#ma-skymines .sm-btn:focus-visible{border-color:#89fbcb;color:#89fbcb;outline:none}
#ma-skymines .sm-btn[aria-pressed="true"]{background:#ff4c0f;border-color:#ff4c0f;color:#fffffe}
#ma-skymines .sm-lane{position:relative;width:var(--bw);height:56px;overflow:hidden;pointer-events:none}
#ma-skymines .sm-layer{position:absolute;top:2px;left:-60px;height:52px;width:auto;transform:rotate(180deg);opacity:0}
#ma-skymines .sm-lane.fly .sm-layer{animation:smLayer 2.2s ease-in-out both}
@keyframes smLayer{0%{opacity:1;left:-60px}95%{opacity:1}100%{opacity:0;left:calc(100% + 20px)}}
#ma-skymines .sm-stage{position:relative;width:var(--bw)}
#ma-skymines .sm-board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;padding:2px;width:100%;background:rgba(11,23,15,.55);border:2px solid #f3ead9;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#ma-skymines .sm-c{position:relative;aspect-ratio:1/1;margin:0;padding:0;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font:800 clamp(14px,2.2vw,20px)/1 'Almarai',sans-serif;color:#0b170f;
  background:radial-gradient(circle at 35% 30%,#fffffe 0%,#f3ead9 55%,#d9cdb6 100%)}
#ma-skymines .sm-c:hover{filter:brightness(1.06)}
#ma-skymines .sm-c:focus-visible{outline:2px solid #ff4c0f;outline-offset:-2px}
#ma-skymines .sm-c.open{background:rgba(72,45,133,.28);cursor:default}
#ma-skymines .sm-c.open:hover{filter:none}
#ma-skymines .sm-c.n1{color:#89fbcb}#ma-skymines .sm-c.n2{color:#c3a6ff}#ma-skymines .sm-c.n3{color:#ff4c0f}#ma-skymines .sm-c.n4{color:#fffffe}
#ma-skymines .sm-c.n5,#ma-skymines .sm-c.n6,#ma-skymines .sm-c.n7,#ma-skymines .sm-c.n8{color:#f3ead9;text-decoration:underline}
#ma-skymines .sm-c img{width:76%;height:76%;object-fit:contain;display:block;pointer-events:none}
#ma-skymines .sm-c svg{width:58%;height:58%;display:block;pointer-events:none}
#ma-skymines .sm-c.spot{background:rgba(15,92,77,.55);cursor:default;box-shadow:inset 0 0 0 2px #89fbcb}
#ma-skymines .sm-c.boom{background:#c1330a}
#ma-skymines .sm-c.fresh{animation:smFresh .9s ease-out}
@keyframes smFresh{0%{box-shadow:inset 0 0 0 3px #fffffe}100%{box-shadow:inset 0 0 0 0 rgba(255,255,254,0)}}
#ma-skymines .sm-gust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ma-skymines .sm-gust i{position:absolute;height:3px;width:40%;background:linear-gradient(90deg,rgba(243,234,217,0),rgba(243,234,217,.85),rgba(243,234,217,0));animation:smWind .9s ease-out both}
@keyframes smWind{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
#ma-skymines .sm-gust.w i{animation-name:smWindW}
@keyframes smWindW{from{transform:translateX(320%)}to{transform:translateX(-120%)}}
#ma-skymines .sm-gust.n i,#ma-skymines .sm-gust.s i{width:3px;height:40%;background:linear-gradient(180deg,rgba(243,234,217,0),rgba(243,234,217,.85),rgba(243,234,217,0));animation-name:smWindS}
@keyframes smWindS{from{transform:translateY(-120%)}to{transform:translateY(320%)}}
#ma-skymines .sm-gust.n i{animation-name:smWindN}
@keyframes smWindN{from{transform:translateY(320%)}to{transform:translateY(-120%)}}
#ma-skymines .sm-msg{margin:0;min-height:1.5em;font-weight:700;font-size:16px;line-height:1.5;color:#f3ead9}
#ma-skymines .sm-msg.bad{color:#ff4c0f}
#ma-skymines .sm-win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;background:rgba(11,23,15,.9)}
#ma-skymines .sm-win p{margin:0;font-family:'Cracked Imperia',Impact,sans-serif;font-weight:400;font-size:clamp(24px,4vw,38px);line-height:1.25;letter-spacing:.04em;text-transform:uppercase;color:#89fbcb;max-width:440px}
#ma-skymines .sm-box{border:0;background:none;padding:0;margin:0;cursor:pointer;width:min(54vw,260px);animation:smRise .8s cubic-bezier(.25,1.4,.45,1) both}
#ma-skymines .sm-box img{width:100%;height:auto;display:block;filter:drop-shadow(0 0 34px rgba(255,76,15,.55))}
#ma-skymines .sm-box:hover img,#ma-skymines .sm-box:focus-visible img{filter:drop-shadow(0 0 46px rgba(255,186,120,.8))}
#ma-skymines .sm-box:focus-visible{outline:3px solid #89fbcb;outline-offset:8px}
@keyframes smRise{from{opacity:0;transform:translateY(50px) scale(.8)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#ma-skymines .sm-cloud,#ma-skymines .sm-lane.fly .sm-layer,#ma-skymines .sm-gust i,#ma-skymines .sm-box{animation:none}}
</style>
<section id="ma-skymines" aria-label="Sky Mines">
  <img class="sm-cloud" style="top:18%" src="https://africhmaurice.github.io/site/assets/games/shared-soft-cloud.png" alt="">
  <img class="sm-cloud c2" style="top:62%" src="https://africhmaurice.github.io/site/assets/games/shared-soft-cloud.png" alt="">
  <div class="sm-wrap">
    <h1>Sky Mines</h1>
    <p class="sm-lede">Clear the clouds and dodge the sky mines. Every fourth move, the wind drifts a mine.</p>
    <div class="sm-bar"><span>Mines <b class="sm-left">20</b></span><span>Gust in <b class="sm-gustin">4</b></span>
      <button class="sm-btn sm-flag" type="button" aria-pressed="false">Flag mode: off</button><button class="sm-btn sm-restart" type="button">Restart</button></div>
    <div class="sm-lane"><img class="sm-layer" src="https://africhmaurice.github.io/site/assets/games/78-mine-layer.png" alt=""></div>
    <div class="sm-stage">
      <div class="sm-board" role="grid" aria-label="Sky Mines field, 10 across and 12 down"></div>
      <div class="sm-gust" aria-hidden="true"></div>
      <div class="sm-win" role="status" hidden>
        <p>Field cleared. The Legendary loot box is yours.</p>
        <button class="sm-box" type="button" aria-label="Open the Sky Mines Legendary loot box"><img src="https://africhmaurice.github.io/site/assets/loot/144.png" alt="Loot box 144"></button>
      </div>
    </div>
    <p class="sm-msg" role="status">Tap any cloud to start. The first one is always clear.</p>
  </div>
</section>
<script>
(function(){
  var d=document.getElementById('ma-skymines');if(!d)return;
  var sec=d.closest('section.page-section')||(d.parentElement&&d.parentElement.closest('section'));if(sec&&sec!==d){sec.style.background='#0b170f';sec.style.minHeight='0';Array.prototype.forEach.call(sec.querySelectorAll('.section-background,.section-border'),function(x){x.style.display='none';});}
  var cw=d.closest('.content-wrapper');if(cw){cw.style.padding='0';cw.style.maxWidth='none';}var fe=d.closest('.fluid-engine');if(fe)fe.style.display='block';
  document.documentElement.style.background=document.body.style.background='#0b170f';

  var K='TUYyRFU5Rzk9Yz90b29sL21vYy5oY2lyZmFlY2lydWFtLnd3dy8vOnNwdHRo';
  function claim(){var u='';try{u=atob(K).split('').reverse().join('');}catch(e){}if(!u)return;
    var w=null;try{w=window.open(u,'_blank');if(w)w.opener=null;}catch(e){}if(!w)location.href=u;}

  var W=10,H=12,MINES=20,GUST_EVERY=4;
  var MINE='https://africhmaurice.github.io/site/assets/games/78-mine.png';
  var FLAG='<img class="sm-skull" src="https://africhmaurice.github.io/site/assets/games/80-dead.webp" alt="" draggable="false">';   // the flag is the X-eyed skull sticker (Maurice 10/26)
  var board=d.querySelector('.sm-board'),stage=d.querySelector('.sm-stage'),lane=d.querySelector('.sm-lane'),gustEl=d.querySelector('.sm-gust');
  var leftEl=d.querySelector('.sm-left'),gustInEl=d.querySelector('.sm-gustin'),msg=d.querySelector('.sm-msg'),win=d.querySelector('.sm-win'),flagBtn=d.querySelector('.sm-flag');
  var cells=[],mine=[],open=[],flag=[],spot=[],laid,over,moveCount,flagMode=false;

  // board width: fits the phone with 20px gutters, caps on desktop; cells stay square
  function size(){var vw=document.documentElement.clientWidth||window.innerWidth||360,bw=Math.max(240,Math.min(500,vw-40));d.style.setProperty('--bw',bw+'px');}
  size();window.addEventListener('resize',size);

  function nb(i){var x=i%W,y=Math.floor(i/W),r=[];for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var nx=x+dx,ny=y+dy;if(nx>=0&&nx<W&&ny>=0&&ny<H)r.push(ny*W+nx);}return r;}
  function count(i){var n=0;nb(i).forEach(function(j){if(mine[j])n++;});return n;}

  function deal(){
    board.innerHTML='';cells=[];mine=[];open=[];flag=[];spot=[];laid=false;over=false;moveCount=0;
    for(var i=0;i<W*H;i++){
      mine[i]=open[i]=flag[i]=spot[i]=false;
      var b=document.createElement('button');b.type='button';b.className='sm-c';b.setAttribute('role','gridcell');b.dataset.i=i;
      b.setAttribute('aria-label','Cloud '+(i%W+1)+', '+(Math.floor(i/W)+1));
      board.appendChild(b);cells.push(b);
    }
    win.hidden=true;msg.className='sm-msg';msg.textContent='Tap any cloud to start. The first one is always clear.';
    lane.classList.remove('fly');void lane.offsetWidth;lane.classList.add('fly');
    status();
  }
  // mines are laid after the first tap, never on it or next to it
  function lay(first){
    var keep={};keep[first]=1;nb(first).forEach(function(j){keep[j]=1;});
    var pool=[];for(var i=0;i<W*H;i++)if(!keep[i])pool.push(i);
    for(var k=0;k<MINES;k++){var r=k+Math.floor(Math.random()*(pool.length-k)),t=pool[k];pool[k]=pool[r];pool[r]=t;mine[pool[k]]=true;}
    laid=true;
  }
  function render(i){
    var b=cells[i];b.className='sm-c';b.innerHTML='';
    if(spot[i]){b.classList.add('spot');b.innerHTML='<img src="'+MINE+'" alt="">';b.setAttribute('aria-label','Spotted sky mine');return;}
    if(open[i]){
      if(mine[i]){b.classList.add('open','boom');b.innerHTML='<img src="'+MINE+'" alt="">';return;}
      var n=count(i);b.classList.add('open');if(n){b.classList.add('n'+n);b.textContent=n;}
      b.setAttribute('aria-label',n?n+' mines near':'Clear sky');return;
    }
    if(flag[i]){b.innerHTML=FLAG;b.setAttribute('aria-label','Flagged cloud');return;}
    if(over&&mine[i]){b.innerHTML='<img src="'+MINE+'" alt="">';}
    b.setAttribute('aria-label','Cloud '+(i%W+1)+', '+(Math.floor(i/W)+1));
  }
  function renderAll(){for(var i=0;i<W*H;i++)render(i);}
  function status(){
    var f=0,s=0;for(var i=0;i<W*H;i++){if(flag[i])f++;if(spot[i])s++;}
    leftEl.textContent=MINES-f-s;gustInEl.textContent=GUST_EVERY-(moveCount%GUST_EVERY);
  }
  // flood-open from i; returns false if it was a mine
  function reveal(i){
    if(open[i]||flag[i]||spot[i])return true;
    if(mine[i]){open[i]=true;return false;}
    var stack=[i];
    while(stack.length){var c=stack.pop();if(open[c]||flag[c]||spot[c]||mine[c])continue;open[c]=true;if(count(c)===0)nb(c).forEach(function(j){if(!open[j])stack.push(j);});}
    return true;
  }
  function won(){for(var i=0;i<W*H;i++)if(!mine[i]&&!open[i])return false;return true;}
  function act(i){
    if(over)return;
    if(!laid)lay(i);
    var ok=true,did=false;
    if(open[i]){
      // chord: a number whose mines are all marked clears its other neighbors
      var n=count(i),m=0;nb(i).forEach(function(j){if(flag[j]||spot[j])m++;});
      if(n&&m===n)nb(i).forEach(function(j){if(!open[j]&&!flag[j]&&!spot[j]){did=true;if(!reveal(j))ok=false;}});
    }else if(!flag[i]&&!spot[i]){did=true;ok=reveal(i);}
    if(!did)return;
    if(!ok){lose();return;}
    moveCount++;
    if(won()){renderAll();winGame();return;}
    if(moveCount%GUST_EVERY===0)gust();else renderAll();
    status();
  }
  function toggleFlag(i){
    if(over||open[i]||spot[i])return;
    flag[i]=!flag[i];render(i);status();
  }
  // THE WIND: one hidden mine drifts one cell with the wind, onto a cell that is still cloud and not a mine.
  // The moved mine is shown (spotted), so the player always knows what changed.
  var DIRS={north:[0,-1],south:[0,1],east:[1,0],west:[-1,0]};
  function gust(){
    var names=Object.keys(DIRS).sort(function(){return Math.random()-.5;}),pick=null,dir=null;
    for(var k=0;k<names.length&&!pick;k++){
      var v=DIRS[names[k]],opts=[];
      for(var i=0;i<W*H;i++){
        if(!mine[i]||spot[i])continue;
        var x=i%W+v[0],y=Math.floor(i/W)+v[1];if(x<0||x>=W||y<0||y>=H)continue;
        var t=y*W+x;if(open[t]||mine[t])continue;opts.push([i,t]);
      }
      if(opts.length){pick=opts[Math.floor(Math.random()*opts.length)];dir=names[k];}
    }
    if(!pick){renderAll();return;}
    var from=pick[0],to=pick[1];
    mine[from]=false;flag[from]=false;mine[to]=true;spot[to]=true;flag[to]=false;
    renderAll();
    cells[from].classList.add('fresh');cells[to].classList.add('fresh');
    nb(from).concat(nb(to)).forEach(function(j){if(open[j]&&!mine[j])cells[j].classList.add('fresh');});
    gustEl.className='sm-gust '+dir.charAt(0);gustEl.innerHTML='';
    for(var s=0;s<5;s++){var l=document.createElement('i');if(dir==='north'||dir==='south'){l.style.left=(10+s*19)+'%';}else{l.style.top=(10+s*19)+'%';}l.style.animationDelay=(s*.08)+'s';gustEl.appendChild(l);}
    msg.className='sm-msg';msg.textContent='A gust drifts a mine '+dir+'. Now you can see it.';
    if(won()){winGame();}
  }
  function lose(){
    over=true;renderAll();status();
    msg.className='sm-msg bad';msg.textContent='Boom. The sky mine got you.';
  }
  function winGame(){
    over=true;for(var i=0;i<W*H;i++)if(mine[i]&&!spot[i])flag[i]=true;renderAll();status();
    msg.className='sm-msg';msg.textContent='';win.hidden=false;

  }

  // input: click/tap clears (or flags in Flag mode), right-click flags, long-press flags on touch
  var press=null,skipClick=false;
  board.addEventListener('pointerdown',function(e){
    var b=e.target.closest('.sm-c');if(!b||e.button>0)return;skipClick=false;
    if(e.pointerType==='mouse')return;
    var i=+b.dataset.i;clearTimeout(press);
    press=setTimeout(function(){press=null;skipClick=true;toggleFlag(i);if(navigator.vibrate)try{navigator.vibrate(30);}catch(e){}},450);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){board.addEventListener(ev,function(){clearTimeout(press);press=null;});});
  board.addEventListener('click',function(e){
    var b=e.target.closest('.sm-c');if(!b)return;
    if(skipClick){skipClick=false;return;}
    var i=+b.dataset.i;
    if(flagMode&&!open[i])toggleFlag(i);else act(i);
  });
  board.addEventListener('contextmenu',function(e){var b=e.target.closest('.sm-c');if(!b)return;e.preventDefault();toggleFlag(+b.dataset.i);});
  flagBtn.onclick=function(){flagMode=!flagMode;flagBtn.setAttribute('aria-pressed',flagMode?'true':'false');flagBtn.textContent='Flag mode: '+(flagMode?'on':'off');};
  d.querySelector('.sm-restart').onclick=deal;
  d.querySelector('.sm-box').onclick=claim;
  deal();
  if(/[?&]test=1(&|$)/.test(location.search))window.__skyMines={state:function(){var m=[],o=[];for(var i=0;i<W*H;i++){if(mine[i])m.push(i);if(open[i])o.push(i);}return{W:W,H:H,mines:m,open:o,spot:spot.map(function(v,i){return v?i:-1;}).filter(function(v){return v>=0;}),over:over,laid:laid,moves:moveCount};}};
})();
</script>
