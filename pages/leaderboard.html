<div style="width:100vw;position:relative;left:50%;margin-left:-50vw;overflow:hidden;z-index:2;isolation:isolate">
  <iframe id="th-leaderboard" src="https://africhmaurice.github.io/leaderboard/?v=8" title="Treasure Hunt Leaderboard" loading="lazy" style="width:100%;height:1200px;border:0;display:block;background:#c1330a;position:relative;z-index:2;pointer-events:auto"></iframe>
</div>
<script>
  (function () {
    var f = document.getElementById('th-leaderboard'), queued = false;
    // Tell the board where it sits on screen so its background can drift (parallax).
    function report() {
      queued = false;
      if (!f.contentWindow) return;
      f.contentWindow.postMessage({ thScroll: { top: f.getBoundingClientRect().top, vh: window.innerHeight } }, 'https://africhmaurice.github.io');
    }
    function queue() { if (!queued) { queued = true; requestAnimationFrame(report); } }
    window.addEventListener('scroll', queue, { passive: true });
    window.addEventListener('resize', queue);
    f.addEventListener('load', queue);
    window.addEventListener('message', function (e) {
      if (e.source === f.contentWindow && e.data && e.data.thLeaderboardHeight) { f.style.height = e.data.thLeaderboardHeight + 'px'; queue(); }
    });
  })();
</script>
