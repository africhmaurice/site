<style>
  /* The artwork is a real fixed background on this page (same technique as the Hunt page sections); the board
     frame is transparent and lays its 90% ember wash over it. Phones and 900px and under scroll normally, like the Hunt page. */
  .th-lb-wrap{width:100vw;position:relative;left:50%;margin-left:-50vw;overflow:hidden;z-index:2;
    background:#c1330a url('https://africhmaurice.github.io/leaderboard/leaderboard-bg-storm.webp') center/cover no-repeat;background-attachment:fixed}
  @media (max-width:900px),(hover:none){.th-lb-wrap{background-attachment:scroll}}
</style>
<div class="th-lb-wrap">
  <iframe id="th-leaderboard" src="https://africhmaurice.github.io/leaderboard/?v=11&amp;embed=1" title="Treasure Hunt Leaderboard" allow="web-share" loading="lazy" allowtransparency="true" style="width:100%;height:1200px;border:0;display:block;background:transparent;color-scheme:normal;position:relative;z-index:2;pointer-events:auto"></iframe>
  <style>
  #lb-more{position:relative;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;gap:20px;padding:8px 16px 64px;background:rgba(193,51,10,.9)}
  #lb-more a{display:inline-block;font-family:'Almarai',sans-serif;font-weight:800;font-size:15px;letter-spacing:.1em;color:#fff;background:#912501;text-decoration:none;border:2px solid #912501;box-shadow:4px 5px 0 rgba(0,0,0,.35);padding:16px 32px;transition:transform .15s ease,background .15s ease,color .15s ease}
  #lb-more a:hover{transform:scale(1.04);background:#fff;color:#912501}
  @media (max-width:560px){#lb-more a{flex:1 1 100%;text-align:center}}
  </style>
  <div id="lb-more">
    <a href="https://www.mauriceafrich.com/games">PLAY GAMES</a>
    <a href="https://www.mauriceafrich.com/lootbox-clue">FIND A LOOT BOX</a>
    <a href="https://www.mauriceafrich.com/the-treasure">SEE THE TREASURE</a>
  </div>
</div>
<script>
  (function () {
    var f = document.getElementById('th-leaderboard');
    // ?act=one|two|three shows that act's standings (Maurice, 2026-10-01): Act One violet, Act Two green, Act Three red.
    var act = (location.search.match(/[?&]act=(one|two|three)/i) || [])[1];
    if (act) {
      act = act.toLowerCase();
      var C = { one: ['#482d85', 'rgba(72,45,133,.9)', '#2d1c53'], two: ['#1a5e41', 'rgba(26,94,65,.9)', '#0f3a27'], three: ['#c1330a', 'rgba(193,51,10,.9)', '#912501'] }[act];
      f.src = 'https://africhmaurice.github.io/leaderboard/act.html?act=' + act + '&embed=1&v=4';
      f.title = 'Act ' + act.charAt(0).toUpperCase() + act.slice(1) + ' Standings';
      var w = f.parentElement; w.style.backgroundColor = C[0];
      var st = document.createElement('style');
      st.textContent = '.th-lb-wrap::before{content:"";position:absolute;inset:0;background:' + C[1] + ';z-index:1;pointer-events:none}#lb-more{background:' + C[1] + '!important}#lb-more a{background:' + C[2] + '!important;border-color:' + C[2] + '!important}#lb-more a:hover{background:#fff!important;color:' + C[2] + '!important}';
      document.head.appendChild(st);
    }
    // A transformed Squarespace container would turn the fixed background back into a scrolling one.
    var sec = f.closest('section');
    for (var a = f.parentElement.parentElement; a && sec && sec.contains(a); a = a.parentElement) {
      var cs = getComputedStyle(a);
      if (cs.transform !== 'none' || cs.willChange.indexOf('transform') >= 0 || cs.filter !== 'none') { a.style.setProperty('transform', 'none', 'important'); a.style.setProperty('will-change', 'auto', 'important'); a.style.setProperty('filter', 'none', 'important'); }
    }
    window.addEventListener('message', function (e) {
      if (e.source === f.contentWindow && e.data && e.data.thLeaderboardHeight) f.style.height = e.data.thLeaderboardHeight + 'px';
    });
  })();
</script>
<!-- LOOT BOX 110 (staged 2026-10-26): The Other Country Loot Box: a tiny red speck in the bottom-left corner of the Other Country board.
     The board inside the frame (treasure-hunt-leaderboard) posts {thLoot:110} when the spot is tapped; this page shows the
     chest and the chest opens the claim. That repo needs its matching change at go-live (see the box150 hides-a report). -->
<style>
.lb110-ov{position:fixed;inset:0;z-index:10050;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(11,23,15,.72)}
.lb110-ov[hidden]{display:none}
.lb110-ov button{display:block;width:clamp(120px,30vw,160px);height:clamp(120px,30vw,160px);padding:0;margin:0;border:0;background:none;cursor:pointer;animation:lb110-pop .45s cubic-bezier(.2,1.6,.4,1)}
.lb110-ov button:focus{outline:none}
.lb110-ov button:focus-visible{outline:3px solid #89fbcb;outline-offset:4px}
.lb110-ov img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 22px rgba(0,0,0,.6))}
@keyframes lb110-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.lb110-ov button{animation:none}}
</style>
<script>(function(){
  var f=document.getElementById('th-leaderboard');if(!f)return;
  // 130 (5 Taps in the Cranium): the board is told who this browser's hunter is (thLoot:me, the same one the loot box
  // page and games keep), and posts {thLoot:130} when that hunter taps their own name five times.
  var KEYS={110:'NkQ0QURaWlc9Yz90b29sL21vYy5oY2lyZmFlY2lydWFtLnd3dy8vOnNwdHRo',130:'RFpSWEI4VVI9Yz90b29sL21vYy5oY2lyZmFlY2lydWFtLnd3dy8vOnNwdHRo'},cur=110;
  function claim(){var u='';try{u=atob(KEYS[cur]).split('').reverse().join('');}catch(e){}if(!u)return;
    var w=null;try{w=window.open(u,'_blank');if(w)w.opener=null;}catch(e){}if(!w)location.href=u;}
  var ov=null;
  function show(){
    if(!ov){ov=document.createElement('div');ov.className='lb110-ov';ov.hidden=true;
      ov.innerHTML='<button type="button" aria-label="Loot box"><img alt="" width="160" height="160"></button>';
      ov.addEventListener('click',function(e){if(e.target===ov)ov.hidden=true;});
      ov.querySelector('button').addEventListener('click',function(){claim();ov.hidden=true;});
      document.body.appendChild(ov);}
    var b=ov.querySelector('button');b.setAttribute('aria-label','Loot box '+cur);b.querySelector('img').src='https://africhmaurice.github.io/site/assets/loot/'+cur+'.png';
    ov.hidden=false;b.focus();
  }
  window.addEventListener('message',function(e){if(e.source===f.contentWindow&&e.data&&(e.data.thLoot===110||e.data.thLoot===130)){cur=e.data.thLoot;show();}});
  function tell(){var me={};try{me=JSON.parse(localStorage.getItem('thLoot:me')||'null')||{};}catch(er){}
    if(f.contentWindow&&(me.handle||me.first_name))f.contentWindow.postMessage({thMe:{handle:me.handle||'',first:me.first_name||''}},'*');}
  f.addEventListener('load',function(){tell();setTimeout(tell,1500);});tell();
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov)ov.hidden=true;});
})();</script>
