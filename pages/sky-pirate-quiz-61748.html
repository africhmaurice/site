  function start(data){
    if(D)return;D=data;N=D.questions.length;
    if(D.eyebrow)$('.q-eyebrow').textContent=D.eyebrow;
    if(D.title)$('.q-h1').textContent=D.title;
    if(D.intro)$('.q-sub').textContent=D.intro;
    if(D.resultLead)$('.r-eye').textContent=D.resultLead;
    if(D.share)$('.r-share').textContent=D.share;
    bar.setAttribute('aria-valuemax',N);
    root.classList.add('ready');show();
  }
  function ok(d){return d&&d.jobs&&d.jobs.length&&d.questions&&d.questions.length&&d.descriptors;}
  $('.r-again').addEventListener('click',function(){i=0;tot={};root.classList.remove('done');show();root.scrollIntoView({behavior:'smooth',block:'start'});});
  start(DATA);
})();
</script>
